<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; connect-src 'self' https://play.atamus.io wss://play.atamus.io; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-src 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Atamus — Log in</title>
  <meta name="description" content="Atamus — a multiplayer space RTS. Own a solar system, mine, and raid through wormholes.">
  <link rel="icon" href="favicon.png" type="image/png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="stylesheet" href="style.css?v=1791944523">
</head>
<body>
  <div class="bg" aria-hidden="true">
    <div class="bg-gradient"></div>
    <div class="bg-grid"></div>
    <svg class="bg-noise" xmlns="http://www.w3.org/2000/svg">
      <filter id="noise">
        <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch">
          <animate attributeName="seed" dur="4s" repeatCount="indefinite" calcMode="discrete"
                   values="0;7;14;21;28;35;42;49;56;3;10;17;24;31;38;45;52;59" />
        </feTurbulence>
        <feColorMatrix type="saturate" values="0"/>
      </filter>
      <rect width="100%" height="100%" filter="url(#noise)"/>
    </svg>
    <div class="bg-vignette"></div>
  </div>

  <header class="site-head"><a class="site-logo" href="index.html"><img src="assets/logo.png" srcset="assets/logo.png 1x, assets/logo@2x.png 2x" width="182" height="36" alt="Atamus"></a></header>

  <main>
    <section class="card" aria-labelledby="title">
      <h1 id="title" class="brand">Log in</h1>

      <form id="login-form" class="form" novalidate>
        <label class="field">
          <span>Username</span>
          <input name="username" type="text" autocomplete="username" required
                 minlength="3" maxlength="24" spellcheck="false">
        </label>

        <label class="field">
          <span>Password</span>
          <input name="password" type="password" autocomplete="current-password" required>
        </label>

        <label class="eula-check">
          <input name="remember" type="checkbox">
          <span>Remember Password</span>
        </label>

        <p class="msg" id="msg" role="alert" hidden></p>

        <button type="submit" class="btn btn-primary" id="submit">Log in</button>
        <a class="btn btn-ghost" href="signup.html" id="to-signup">Create account</a>
        <a class="link-small" href="recover.html">Forgot your password?</a>
      </form>

      <!-- (owner) a banned player's appeal: a conversation with the admins while the ban lasts -->
      <div id="appeal" class="appeal" hidden>
        <div class="appeal-lines" id="appeal-lines"></div>
        <p class="appeal-state" id="appeal-state"></p>
        <form id="appeal-form" class="form" novalidate>
          <label class="field">
            <span id="appeal-label">Appeal</span>
            <textarea name="text" rows="3" maxlength="1000" required></textarea>
          </label>
          <p class="msg" id="appeal-msg" role="alert" hidden></p>
          <button type="submit" class="btn btn-primary" id="appeal-send">Send</button>
        </form>
      </div>
    </section>
  </main>

  <script src="api.js?v=1791763226"></script>
  <script src="login.js?v=1791944523" defer></script>
</body>
</html>
