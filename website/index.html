<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Atamus</title>
  <meta name="description" content="Atamus — a multiplayer space RTS. Own a solar system, mine, and raid through wormholes.">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="bg" aria-hidden="true">
    <div class="bg-gradient"></div>
    <div class="bg-grid"></div>
    <svg class="bg-noise" xmlns="http://www.w3.org/2000/svg">
      <filter id="noise">
        <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch">
          <animate attributeName="seed" from="0" to="60" dur="4s" repeatCount="indefinite" calcMode="discrete"
                   values="0;7;14;21;28;35;42;49;56;3;10;17;24;31;38;45;52;59" />
        </feTurbulence>
        <feColorMatrix type="saturate" values="0"/>
      </filter>
      <rect width="100%" height="100%" filter="url(#noise)"/>
    </svg>
    <div class="bg-vignette"></div>
  </div>

  <main>
    <a id="download" class="btn" href="https://github.com/AtamusRegis/atamus/releases/latest" rel="noopener">
      <span class="btn-label">Download Installer</span>
      <span class="btn-meta" id="download-meta"></span>
    </a>
  </main>

  <script src="main.js" defer></script>
</body>
</html>
