  <style>
    /* (owner, 2026-11-11) Critter Courier: grab a parcel, ride, deliver, roll. Phone first. */
    @font-face { font-family: "Big Shoulders Display"; font-weight: 800; font-display: swap; src: url("fonts/big-shoulders-display-latin-800-normal.woff2") format("woff2"); }
    :root { --ink: #23303b; --card: rgba(255,255,255,.95); --line: #d7e1ea; --gold: #f2b01e; --blue: #3a8ee6; --green: #3fb36b; --red: #e5534b; --st: env(safe-area-inset-top, 0px); --sb: env(safe-area-inset-bottom, 0px); --sl: env(safe-area-inset-left, 0px); --sr: env(safe-area-inset-right, 0px); color-scheme: light; }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; height: 100%; overflow: hidden; background: #8fd3ff; color: var(--ink); font: 700 14px ui-rounded, "SF Pro Rounded", system-ui, -apple-system, "Segoe UI", sans-serif; user-select: none; -webkit-user-select: none; touch-action: none; }
    #gl { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }

    #hud { display: none; }
    .pill { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 999px; background: var(--card); box-shadow: 0 3px 0 rgba(0,0,0,.14); }
    /* (owner, 2026-11-12) Aura: a shiny purple orb that shimmers */
    .coin { display: inline-block; width: 18px; height: 18px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #ffffff, #e2b8ff 25%, #a45be0 60%, #5a1f9a); border: 2px solid #4a1680; box-shadow: 0 0 8px #c77dff; flex: none; position: relative; overflow: hidden; }
    .coin::after { content: ""; position: absolute; inset: -40%; background: linear-gradient(115deg, transparent 40%, rgba(255,255,255,.85) 50%, transparent 60%); animation: aurashine 2.4s ease-in-out infinite; }
    @keyframes aurashine { 0%, 55% { transform: translateX(-70%); } 100% { transform: translateX(70%); } }
    /* Aura, top left */
    #coins { position: fixed; left: calc(10px + var(--sl)); top: calc(10px + var(--st)); font-size: 20px; font-family: "Big Shoulders Display", system-ui, sans-serif; }
    #coins.bump { animation: bump .25s; }
    @keyframes bump { 40% { transform: scale(1.18); } }
    #bchat { position: fixed; left: calc(10px + var(--sl)); top: calc(52px + var(--st)); width: 38px; height: 34px; border: 0; border-radius: 12px; background: var(--card); box-shadow: 0 3px 0 rgba(0,0,0,.14); display: grid; place-items: center; }
    #bchat svg, .mbtn svg { width: 26px; height: 26px; } .ico { display: block; } #pclose svg { width: 18px; height: 18px; margin: auto; } #party button svg { width: 12px; height: 12px; display: block; }
    .act svg { position: relative; z-index: 1; width: 55%; height: 55%; } #bbig svg { width: 58%; height: 58%; } #buildbar .bt svg, #zpanel .bt svg, #pprompt .bt svg { width: 18px; height: 18px; vertical-align: middle; }

    #card { position: fixed; left: 50%; top: calc(10px + var(--st)); transform: translateX(-50%); display: none; flex-direction: column; align-items: stretch; gap: 4px; padding: 6px 10px; border-radius: 16px; background: var(--card); box-shadow: 0 3px 0 rgba(0,0,0,.14); max-width: calc(100vw - 150px); }
    .prow { display: flex; align-items: center; gap: 6px; white-space: nowrap; } .prow.gone { opacity: .45; filter: grayscale(.8); }

    .act::after { content: ""; position: absolute; inset: 0; border-radius: 50%; background: conic-gradient(rgba(35,48,59,.5) var(--cd, 0deg), transparent 0); pointer-events: none; }

    #bbig { right: calc(16px + var(--sr)); bottom: calc(18px + var(--sb)); width: 84px; height: 84px; background: #ff7a59; color: #fff; font-size: 16px; line-height: 1.05; }

    #pbox { width: min(560px, 100%); max-height: min(86vh, 100%); display: flex; flex-direction: column; background: #fff; border-radius: 20px; box-shadow: 0 6px 0 rgba(0,0,0,.2); overflow: hidden; }

    /* (owner, 2026-11-13) the zone builder's bar: pieces, turn and close on top; sizes, material or zone under */
    #buildbar { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(10px + var(--sb)); z-index: 26; display: none; flex-direction: column; gap: 6px; align-items: center; width: max-content; max-width: calc(100vw - 16px); }

    #buildbar .btile { width: 64px; height: 70px; padding: 4px 2px 3px; border-radius: 14px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; background: var(--card); }
    #buildbar .btile img { width: 46px; height: 46px; object-fit: contain; pointer-events: none; } #buildbar .btile span { font-size: 10px; line-height: 1.1; white-space: nowrap; } #buildbar .btile.on { background: #ffd84a; }
    body.cinema #buildbar, body.cinema #zpanel, body.cinema #pprompt { opacity: 0; pointer-events: none; }
    #buildbar .brow { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; } #buildbar .bt { padding: 7px 11px; } #buildbar .bt.on { background: #ffd84a; }

    #pprompt { position: fixed; left: 50%; top: 40%; transform: translate(-50%, -50%); z-index: 27; display: none; gap: 8px; background: var(--card); border-radius: 14px; padding: 10px; box-shadow: 0 6px 20px rgba(0,0,0,.25); } #pprompt .go { padding: 10px 26px; font-size: 18px; }
    #zpanel { position: fixed; left: calc(12px + var(--sl)); bottom: calc(150px + var(--sb)); z-index: 27; display: none; background: var(--card); border-radius: 14px; padding: 12px; width: 270px; max-height: calc(100vh - 170px); overflow-y: auto; box-shadow: 0 6px 20px rgba(0,0,0,.25); }
    #zpanel > b { display: inline-block; font-size: 16px; margin-bottom: 8px; } #zpanel .zrow { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 5px 0; font-weight: 700; white-space: nowrap; }
    #zpanel .zsub { display: block; margin: 10px 0 4px; } #zpanel .zshot { display: flex; align-items: center; gap: 4px; margin: 4px 0; } #zpanel .zshot i { font-style: normal; font-weight: 700; width: 14px; } #zpanel .zshot input { flex: 1; width: auto; min-width: 0; } #zpanel .zshot .bt { padding: 4px 7px; } #zpanel .zshot.pick .bt:first-of-type { background: #ffd84a; } #zpanel .zadd { width: 100%; }
    #zpanel input, #zpanel select { width: 120px; padding: 4px 6px; border-radius: 8px; border: 1px solid #c9d2da; font: inherit; } #zpanel .go { width: 100%; margin-top: 8px; }
    #buildbar .mat { color: #1d232a; text-shadow: 0 1px 0 rgba(255,255,255,.6); }
    body.building .act, body.building #gifts { display: none !important; } body.building #mbuild { background: #ffd84a; }
    .btn { border: 0; border-radius: 12px; padding: 8px 14px; background: #e6edf3; box-shadow: 0 3px 0 rgba(0,0,0,.14); display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
    .btn.go { background: var(--green); color: #fff; } .btn.buy { background: #ffe9a8; } .btn.coupon { background: #ffd1f0; }
    .btn:disabled { opacity: .45; box-shadow: none; cursor: default; }
    .acts { display: flex; gap: 8px; align-items: center; } .acts.wrap { flex-wrap: wrap; }
    .bar { flex: 1; height: 10px; border-radius: 5px; background: #e6edf3; overflow: hidden; min-width: 40px; } .bar i { display: block; height: 100%; background: var(--blue); border-radius: 5px; }
    .pips { display: flex; gap: 3px; } .pips i { min-width: 12px; height: 12px; border-radius: 4px; background: #d7e1ea; font-style: normal; font-size: 10px; line-height: 12px; text-align: center; padding: 0 3px; color: #7f8b97; } .pips i.on { background: var(--gold); color: #fff; }
    .mdetail { display: flex; gap: 12px; align-items: center; } .mdetail img.big { width: 120px; height: 120px; flex: none; border-radius: 16px; background: #eaf6ff; }
    .minfo { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 5px; } .minfo h3 { margin: 0; font-size: 22px; font-family: "Big Shoulders Display", system-ui, sans-serif; } .rar { font-size: 13px; }
    .lvrow, .stat { display: flex; align-items: center; gap: 8px; } .stat span { width: 56px; } .stat em { font-style: normal; width: 40px; text-align: right; } .stat.ab span { width: auto; } .stat.ab.off { opacity: .5; } .stat.pup em { text-align: left; } .stat.pup .btn, .stat.pup .max { margin-left: auto; } .stat.pup .max { color: var(--gold); }
    .eggs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; } .eggc { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 4px; border-radius: 14px; background: #f3f7fa; text-align: center; font-size: 12px; }
    .egg { display: block; width: 34px; height: 44px; border-radius: 50% 50% 48% 48% / 60% 60% 40% 40%; box-shadow: inset -5px -6px 0 rgba(0,0,0,.12); }
    .odds { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; font-size: 12px; }
    .mgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(64px, 1fr)); gap: 8px; }
    .mtile { position: relative; aspect-ratio: 1; border: 3px solid var(--line); border-radius: 14px; background: #f3f7fa; padding: 0; overflow: hidden; } .mtile img { width: 100%; height: 100%; display: block; }
    .mtile b { position: absolute; right: 3px; bottom: 2px; font-size: 12px; background: #fff; border-radius: 6px; padding: 0 4px; } .mtile.sel { box-shadow: 0 0 0 3px var(--ink); } .mtile.ride::after { content: ""; position: absolute; left: 4px; top: 4px; width: 10px; height: 10px; border-radius: 50%; background: var(--green); border: 2px solid #fff; }
    .mtile.va1 { background: radial-gradient(circle at 50% 40%, #ffffff, #e3f4ff 70%); } .mtile.va1::before { content: ""; position: absolute; inset: 0; pointer-events: none; background: radial-gradient(circle at 18% 22%, #fff 0 2px, transparent 3px), radial-gradient(circle at 80% 30%, #fff6c2 0 2px, transparent 3px), radial-gradient(circle at 70% 78%, #c9f0ff 0 2px, transparent 3px), radial-gradient(circle at 30% 70%, #ffd1f3 0 1.5px, transparent 2.5px); animation: twinkle 1.4s ease-in-out infinite alternate; } @keyframes twinkle { from { opacity: 0.25; } to { opacity: 1; } }
    .btn.trail { background: #e8f2ff; color: #3a5a80; } .btn.trail.on { background: #9aa8ff; color: #fff; }
    .btn.fuse { background: linear-gradient(90deg, #ff6b6b, #ffd84a, #7ee08a, #6bb8ff, #b48cff); color: #fff; text-shadow: 0 1px 0 rgba(0,0,0,.35); }
    .rank { display: flex; align-items: center; gap: 8px; font-size: 16px; } .badge { width: 20px; height: 24px; clip-path: polygon(0 0, 100% 0, 100% 62%, 50% 100%, 0 62%); }
    .rank span { margin-left: auto; color: #7f8b97; }
    .uprow { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; align-items: center; padding: 8px 10px; border-radius: 14px; background: #f3f7fa; } .uprow .val { color: #5a6875; font-size: 13px; } .uprow .max { color: var(--gold); }
    .orow { display: flex; align-items: center; gap: 10px; padding: 6px 10px; border-radius: 12px; background: #f3f7fa; } .orow b { width: 92px; flex: none; } .orow .odds { flex: 1; display: grid; grid-template-columns: repeat(5, 1fr); text-align: center; } .orow em { font-style: normal; color: #5a6875; font-size: 12px; margin-left: auto; white-space: nowrap; } .orow.off { opacity: .4; } .orow.head { background: none; padding-bottom: 0; font-size: 11px; }
    .setrow { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 8px 10px; border-radius: 12px; background: #f3f7fa; } .setrow input[type=range] { flex: 1; max-width: 240px; } .setrow input[type=checkbox] { width: 24px; height: 24px; }
    .swatches { display: flex; gap: 6px; } .swatches button { width: 26px; height: 26px; border-radius: 8px; border: 3px solid #fff; box-shadow: 0 0 0 2px var(--line); } .swatches button.on { box-shadow: 0 0 0 3px var(--ink); }

    .arow { text-align: left; border: 0; border-radius: 10px; padding: 6px 10px; background: #f3f7fa; } .arow.on::before { content: "● "; color: var(--green); } .arow.sel { background: #ffe9a8; }
    /* hatching */
    #hatch { position: fixed; inset: 0; z-index: 30; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 8px; background: radial-gradient(circle, var(--glow, #fff) 0, rgba(20,40,60,.82) 62%); }
    #hegg { width: 120px; height: 156px; } .egg.fuse { width: 130px; height: 130px; border-radius: 50%; background: conic-gradient(#ff6b6b, #ffd84a, #7ee08a, #6bb8ff, #b48cff, #ff6b6b) !important; } .egg.gift { border-radius: 14px; height: 120px; background: linear-gradient(90deg, transparent 42%, #fff 42% 58%, transparent 58%), linear-gradient(transparent 42%, #fff 42% 58%, transparent 58%), #ff1f8f !important; } .egg.wob { animation: wob 1.5s; } @keyframes wob { 10%, 38%, 66% { transform: rotate(-14deg); } 20%, 48%, 76% { transform: rotate(14deg); } 28%, 56%, 84% { transform: rotate(0); } 96% { transform: scale(1.25); } }
    #himg { width: 220px; height: 220px; animation: popin .35s; } #hname { font-size: 38px; color: #fff; text-shadow: 0 3px 0 rgba(0,0,0,.35); } #hrar { font-size: 22px; padding: 2px 14px; border-radius: 999px; background: rgba(35,48,59,.88); }
    @keyframes popin { from { transform: scale(.2); } 70% { transform: scale(1.15); } }
    /* (owner, 2026-11-11) more punch: rays behind a parcel as it builds up (stronger the rarer), a new mount dropping in
       over spinning rays, a level-up card with the mount and a shine across it, letterbox bars for a new area's showing */
    #gopen { position: relative; overflow: visible; } #gopen > :not(#grays) { position: relative; }
    #grays { position: absolute; left: 50%; top: 42%; width: 260px; height: 260px; margin: -130px 0 0 -130px; border-radius: 50%; pointer-events: none; opacity: var(--ray, 0); background: repeating-conic-gradient(from 0deg, var(--rc) 0 9deg, transparent 9deg 24deg); -webkit-mask: radial-gradient(circle, #000 18%, transparent 68%); mask: radial-gradient(circle, #000 18%, transparent 68%); animation: spin 3s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .gtile.big.burst { animation: gburst .5s ease-out; } @keyframes gburst { 0% { transform: scale(1); filter: brightness(1); } 40% { transform: scale(1.8); filter: brightness(3) drop-shadow(0 0 24px var(--rc)); } 100% { transform: scale(.2); opacity: 0; } }
    .confetti { position: fixed; width: 9px; height: 13px; border-radius: 2px; pointer-events: none; z-index: 40; }
    #hrays { position: absolute; left: 50%; top: 50%; width: 900px; height: 900px; margin: -450px 0 0 -450px; pointer-events: none; display: none; background: repeating-conic-gradient(from 0deg, var(--glow, #fff) 0 7deg, transparent 7deg 22deg); -webkit-mask: radial-gradient(circle, #000 8%, transparent 55%); mask: radial-gradient(circle, #000 8%, transparent 55%); opacity: .55; animation: spin 7s linear infinite; }
    #hatch.won #hrays { display: block; } #hatch > :not(#hrays) { position: relative; }

    #hatch.won #hname { animation: rowin .5s .5s both; }
    #hatch #hnew { position: absolute; left: 0; right: 0; top: calc(50% - 175px); margin: 0 auto; width: max-content; z-index: 2; }   /* over the mount, so it doesn't push the unboxing off center */
    #hnew { display: none; font-size: 30px; color: #fff; background: #ff1f8f; padding: 2px 16px; border-radius: 999px; transform: rotate(-8deg); box-shadow: 0 3px 0 rgba(0,0,0,.25); }
    #hatch.won.first #hnew { display: block; animation: popin .5s .7s both; }
    #lvup { position: fixed; left: 50%; top: 34%; z-index: 25; transform: translate(-50%, -50%); display: none; flex-direction: column; align-items: center; pointer-events: none; }
    #lvup.go { display: flex; animation: lvin 2.2s ease-out both; } @keyframes lvin { 0% { transform: translate(-50%, -50%) scale(.2); opacity: 0; } 12% { transform: translate(-50%, -50%) scale(1.15); opacity: 1; } 22% { transform: translate(-50%, -50%) scale(1); } 80% { opacity: 1; } 100% { transform: translate(-50%, -62%) scale(.9); opacity: 0; } }
    #lvrays { position: absolute; left: 50%; top: 45%; width: 340px; height: 340px; margin: -170px 0 0 -170px; background: repeating-conic-gradient(#ffd84a 0 8deg, transparent 8deg 22deg); -webkit-mask: radial-gradient(circle, #000 15%, transparent 65%); mask: radial-gradient(circle, #000 15%, transparent 65%); animation: spin 4s linear infinite; }
    #lvimg { position: relative; width: 150px; height: 150px; -webkit-mask: linear-gradient(#000, #000); filter: drop-shadow(0 0 14px #ffd84a); }
    #lvup.go #lvimg { animation: lvhop .6s .15s 2; } @keyframes lvhop { 50% { transform: translateY(-18px) scale(1.08); } }
    #lvup::after { content: ""; position: absolute; left: 50%; top: 10px; width: 150px; height: 150px; margin-left: -75px; background: linear-gradient(115deg, transparent 30%, rgba(255,255,255,.85) 48%, transparent 66%); background-size: 300% 100%; -webkit-mask: var(--lvm) center / contain no-repeat; mask: var(--lvm) center / contain no-repeat; animation: shine 1.1s .3s 2; }
    @keyframes shine { from { background-position: 100% 0; } to { background-position: 0 0; } }
    #lvt { position: relative; font-size: 40px; color: #ffd84a; text-shadow: 0 3px 0 rgba(0,0,0,.4), 0 0 18px rgba(255,216,74,.7); }
    body.cinema #hud, body.cinema #joy, body.cinema #tut { opacity: 0; pointer-events: none; transition: opacity .4s; }
    #cine i { position: fixed; left: 0; right: 0; height: 0; background: #0b1218; z-index: 28; transition: height .5s; } #cine i:first-child { top: 0; } #cine i:last-child { bottom: 0; } #cine.on i { height: 11vh; }
    /* (owner, 2026-11-11) a run's parcels open full screen, one after another, once there are none left to deliver */
