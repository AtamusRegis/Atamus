  <style>
    /* (owner, 2026-11-11) Critter Courier: grab a parcel, ride, deliver, roll. Phone first. */
    @font-face { font-family: "Big Shoulders Display"; font-weight: 800; font-display: swap; src: url("fonts/big-shoulders-display-latin-800-normal.woff2") format("woff2"); }
    :root { --ink: #23303b; --card: rgba(255,255,255,.95); --line: #d7e1ea; --gold: #f2b01e; --blue: #3a8ee6; --green: #3fb36b; --red: #e5534b; --st: env(safe-area-inset-top, 0px); --sb: env(safe-area-inset-bottom, 0px); --sl: env(safe-area-inset-left, 0px); --sr: env(safe-area-inset-right, 0px); color-scheme: light; }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; height: 100%; overflow: hidden; background: #8fd3ff; color: var(--ink); font: 700 14px ui-rounded, "SF Pro Rounded", system-ui, -apple-system, "Segoe UI", sans-serif; user-select: none; -webkit-user-select: none; touch-action: none; }

    #stamp { position: fixed; left: calc(12px + var(--sl)); top: calc(96px + var(--st)); width: 34px; height: min(34vh, 220px); border-radius: 17px; background: var(--card); box-shadow: 0 3px 0 rgba(0,0,0,.14); padding: 5px; display: flex; flex-direction: column; align-items: center; }
    #stamp .track { position: relative; flex: 1; width: 14px; border-radius: 7px; background: #e6edf3; overflow: hidden; margin-bottom: 4px; }

    .mtile.va1 { background: #e8f6ff; } .mtile.va2 { background: #fff3c4; }

    .setrow { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 8px 10px; border-radius: 12px; background: #f3f7fa; } .setrow input[type=range] { flex: 1; max-width: 240px; } .setrow input[type=checkbox] { width: 24px; height: 24px; }

    #hegg { width: 120px; height: 156px; } .egg.gift { border-radius: 14px; height: 120px; background: linear-gradient(90deg, transparent 42%, #fff 42% 58%, transparent 58%), linear-gradient(transparent 42%, #fff 42% 58%, transparent 58%), #ff1f8f !important; } .egg.wob { animation: wob 1.5s; } @keyframes wob { 10%, 38%, 66% { transform: rotate(-14deg); } 20%, 48%, 76% { transform: rotate(14deg); } 28%, 56%, 84% { transform: rotate(0); } 96% { transform: scale(1.25); } }
    #himg { width: 220px; height: 220px; animation: popin .35s; } #hname { font-size: 38px; color: #fff; text-shadow: 0 3px 0 rgba(0,0,0,.35); } #hrar { font-size: 22px; padding: 2px 14px; border-radius: 999px; background: rgba(35,48,59,.88); }

    #gq { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; min-height: 0; } #gq b { font-size: 14px; color: #fff; text-shadow: 0 1px 0 rgba(0,0,0,.5); }

    #gopen { display: none; flex-direction: column; align-items: center; gap: 2px; padding: 8px; border-radius: 14px; background: rgba(35,48,59,.88); cursor: pointer; box-shadow: 0 3px 0 rgba(0,0,0,.25), 0 0 var(--glow, 8px) var(--gc); }

  <div id="pops"></div>
