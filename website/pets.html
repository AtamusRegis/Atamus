<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; connect-src 'self' wss://play.atamus.io ws://localhost:* ws://127.0.0.1:*; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-src 'none'">
  <!-- the game server (moving to another server: change it here and in connect-src above) -->
  <meta name="pets-server" content="wss://play.atamus.io/pets">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#7ec8f0">
  <title>Pet Delivery Co.</title>
  <link rel="icon" href="favicon.png" type="image/png">
  <style>
    /* (owner, 2026-11-08) Pet Delivery Co.: ride your pet around town delivering mail, co-op, phone first. */
    @font-face { font-family: "Big Shoulders Display"; font-weight: 800; font-display: swap; src: url("fonts/big-shoulders-display-latin-800-normal.woff2") format("woff2"); }
    :root { --ink: #23303b; --card: rgba(255,255,255,.94); --line: #d7e1ea; --gold: #f2b01e; --blue: #3a8ee6; --green: #3fb36b; --red: #e5534b; color-scheme: light; }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; height: 100%; overflow: hidden; background: #7ec8f0; color: var(--ink); font: 600 14px ui-rounded, "SF Pro Rounded", system-ui, -apple-system, "Segoe UI", sans-serif; user-select: none; -webkit-user-select: none; }
    canvas { display: block; }
    #gl { position: fixed; inset: 0; width: 100%; height: 100%; touch-action: none; }
    .pill { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 999px; background: var(--card); box-shadow: 0 2px 0 rgba(0,0,0,.12); }
    #top { position: fixed; top: max(10px, env(safe-area-inset-top)); left: max(10px, env(safe-area-inset-left)); right: max(10px, env(safe-area-inset-right)); display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; pointer-events: none; z-index: 5; }
    #top > div { display: flex; flex-direction: column; gap: 6px; align-items: flex-start; }
    #top > div:last-child { align-items: flex-end; }
    #coins { font: 800 24px "Big Shoulders Display", Impact, sans-serif; letter-spacing: .03em; }
    .coin { width: 18px; height: 18px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #ffe38a, var(--gold) 60%, #c98a0a); border: 2px solid #b47a07; }
    #who { font-size: 12px; opacity: .85; }
    #bag b, #online b { font-size: 16px; }
    .box { width: 16px; height: 13px; background: #c98b4f; border: 2px solid #8a5a2b; border-radius: 3px; }
    .dot { width: 10px; height: 10px; border-radius: 50%; background: #9aa7b2; }
    .dot.on { background: var(--green); }
    #contract { min-width: 190px; flex-direction: column; align-items: stretch; gap: 4px; padding: 8px 12px; border-radius: 14px; }
    #contract .bar { height: 10px; border-radius: 6px; background: #e3eaf0; overflow: hidden; }
    #contract .bar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--gold), #ffd35a); }
    #contract .row { display: flex; justify-content: space-between; font-size: 13px; }
    #side { position: fixed; right: max(12px, env(safe-area-inset-right)); bottom: max(16px, env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 10px; align-items: flex-end; z-index: 5; }
    .btn { border: 0; border-radius: 16px; padding: 12px 16px; min-width: 64px; min-height: 52px; font: 800 15px ui-rounded, system-ui, sans-serif; color: #fff; background: var(--blue); box-shadow: 0 4px 0 rgba(0,0,0,.18); cursor: pointer; position: relative; }
    .btn:active { transform: translateY(2px); box-shadow: 0 2px 0 rgba(0,0,0,.18); }
    .btn:disabled { opacity: .45; cursor: default; }
    .btn.gold { background: var(--gold); color: #3b2a00; } .btn.green { background: var(--green); } .btn.ghost { background: #fff; color: var(--ink); }
    .btn .n { position: absolute; top: -6px; right: -6px; min-width: 22px; height: 22px; padding: 0 5px; border-radius: 11px; background: var(--red); color: #fff; font-size: 12px; line-height: 22px; text-align: center; }
    #items { display: flex; gap: 8px; }
    #items .btn { min-width: 52px; padding: 10px; }
    .ico { display: inline-block; width: 22px; height: 22px; vertical-align: middle; }
    #joy { position: fixed; width: 120px; height: 120px; margin: -60px 0 0 -60px; border-radius: 50%; background: rgba(255,255,255,.28); border: 3px solid rgba(255,255,255,.7); pointer-events: none; display: none; z-index: 4; }
    #joy i { position: absolute; left: 50%; top: 50%; width: 52px; height: 52px; margin: -26px 0 0 -26px; border-radius: 50%; background: rgba(255,255,255,.9); }
    .panel { position: fixed; left: 50%; bottom: max(16px, env(safe-area-inset-bottom)); transform: translateX(-50%); width: min(440px, calc(100vw - 24px)); max-height: 70vh; overflow: auto; background: var(--card); border-radius: 22px; padding: 14px 16px 16px; box-shadow: 0 10px 30px rgba(0,0,0,.25); z-index: 8; display: none; }
    .panel h2 { margin: 0 0 10px; font: 800 26px "Big Shoulders Display", Impact, sans-serif; letter-spacing: .03em; display: flex; justify-content: space-between; align-items: center; }
    .panel .x { border: 0; background: #e9eef3; width: 36px; height: 36px; border-radius: 50%; font: 800 18px system-ui; color: var(--ink); cursor: pointer; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 10px; }
    .card { border: 2px solid var(--line); border-radius: 16px; padding: 10px; display: flex; flex-direction: column; gap: 6px; align-items: center; text-align: center; background: #fff; cursor: pointer; }
    .card.on { border-color: var(--blue); box-shadow: 0 0 0 3px rgba(58,142,230,.25); }
    .card img, .card svg { width: 84px; height: 84px; }
    .card .nm { font-weight: 800; }
    .card svg.ico { width: 18px; height: 18px; vertical-align: -4px; }
    .btn.small { min-height: 36px; padding: 6px 10px; font-size: 13px; border-radius: 12px; }
    .card .rar { font-size: 12px; font-weight: 800; }
    .stats { font-size: 12px; opacity: .8; display: flex; gap: 10px; justify-content: center; }
    .row2 { display: flex; gap: 10px; align-items: center; justify-content: space-between; margin-top: 10px; }
    #toast { position: fixed; left: 50%; top: 30%; transform: translateX(-50%); z-index: 9; pointer-events: none; display: flex; flex-direction: column; align-items: center; gap: 6px; }
    #toast div { padding: 8px 14px; border-radius: 999px; background: var(--card); font-weight: 800; animation: up 1.6s ease-out forwards; }
    @keyframes up { 0% { opacity: 0; transform: translateY(10px); } 15% { opacity: 1; transform: none; } 75% { opacity: 1; } 100% { opacity: 0; transform: translateY(-30px); } }
    #hatch { position: fixed; inset: 0; z-index: 10; display: none; align-items: center; justify-content: center; flex-direction: column; gap: 12px; background: rgba(20,30,45,.55); }
    #hatch canvas { width: 220px; height: 220px; }
    #hatch .nm { font: 800 34px "Big Shoulders Display", Impact, sans-serif; color: #fff; letter-spacing: .04em; text-shadow: 0 3px 0 rgba(0,0,0,.25); }
    #hatch .rar { font-weight: 800; font-size: 18px; padding: 4px 14px; border-radius: 999px; background: #fff; }
    #banner { position: fixed; left: 0; right: 0; top: 18%; text-align: center; z-index: 9; pointer-events: none; font: 800 54px "Big Shoulders Display", Impact, sans-serif; letter-spacing: .04em; text-shadow: 0 4px 0 rgba(0,0,0,.28), 0 0 24px rgba(255,200,60,.6); opacity: 0; }
    #banner.go { animation: ban 2.4s ease-out forwards; }
    @keyframes ban { 0% { opacity: 0; transform: scale(.4) rotate(-6deg); } 12% { opacity: 1; transform: scale(1.15) rotate(2deg); } 22% { transform: scale(1) rotate(0); } 80% { opacity: 1; } 100% { opacity: 0; transform: translateY(-20px); } }
    .card.wide { flex-direction: row; text-align: left; margin-bottom: 10px; }
    .card.wide .col { flex: 1; display: flex; flex-direction: column; gap: 4px; }
    .card.wide .stats { justify-content: flex-start; }
    #wanted { color: var(--red); font-size: 17px; letter-spacing: 1px; text-shadow: 0 1px 0 #fff; }
    #chatlog { position: fixed; left: max(10px, env(safe-area-inset-left)); bottom: max(16px, env(safe-area-inset-bottom)); width: min(320px, calc(100vw - 120px)); display: flex; flex-direction: column; gap: 4px; pointer-events: none; z-index: 4; }
    #chatlog div { padding: 5px 10px; border-radius: 12px; background: rgba(255,255,255,.82); font-size: 13px; overflow-wrap: anywhere; transition: opacity 1s; }
    #chatlog div.old { opacity: 0; }
    #chatbar { position: fixed; left: 50%; transform: translateX(-50%); bottom: max(16px, env(safe-area-inset-bottom)); width: min(440px, calc(100vw - 24px)); display: none; gap: 8px; z-index: 9; }
    #chatbar input { flex: 1; min-width: 0; border: 0; border-radius: 16px; padding: 0 14px; font: 600 16px ui-rounded, system-ui, sans-serif; color: var(--ink); background: #fff; box-shadow: 0 4px 0 rgba(0,0,0,.18); outline: none; }
    #party { display: none; gap: 4px; flex-wrap: wrap; align-items: center; pointer-events: auto; max-width: 60vw; }
    #party .pill { font-size: 12px; padding: 4px 10px; color: var(--green); }
    #party .x { border: 0; background: #fff; width: 26px; height: 26px; border-radius: 50%; font: 800 12px system-ui; color: var(--ink); cursor: pointer; }
    #acts { display: flex; flex-direction: column; gap: 8px; align-items: flex-end; }
    #acts .btn { min-height: 44px; padding: 8px 14px; }
    kbd { display: inline-block; min-width: 20px; padding: 1px 5px; border-radius: 5px; background: var(--ink); color: #fff; font: 800 12px system-ui; margin-right: 4px; }
    #invite { position: fixed; top: 22%; left: 50%; transform: translateX(-50%); z-index: 11; display: none; align-items: center; gap: 10px; padding: 10px 12px 10px 16px; border-radius: 18px; background: var(--card); box-shadow: 0 10px 30px rgba(0,0,0,.25); }
    #invite #ikind { opacity: .8; }
    #invite .btn { min-height: 42px; min-width: 46px; padding: 8px 12px; }
    #login { position: fixed; inset: 0; z-index: 20; display: none; align-items: center; justify-content: center; background: rgba(20,30,45,.45); padding: 16px; }
    #login .lbox { width: min(360px, 100%); background: var(--card); border-radius: 22px; padding: 18px; display: flex; flex-direction: column; gap: 10px; box-shadow: 0 10px 30px rgba(0,0,0,.25); }
    #login h1 { margin: 0 0 4px; font: 800 34px "Big Shoulders Display", Impact, sans-serif; letter-spacing: .03em; text-align: center; }
    #login input, .coinin input { border: 2px solid var(--line); border-radius: 14px; padding: 12px 14px; font: 600 16px ui-rounded, system-ui, sans-serif; color: var(--ink); background: #fff; outline: none; min-width: 0; }
    #login input:focus, .coinin input:focus { border-color: var(--blue); }
    #lerr { color: var(--red); font-size: 13px; min-height: 16px; text-align: center; }
    .tside { display: flex; flex-direction: column; gap: 6px; margin-bottom: 10px; }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; min-height: 30px; }
    .chip { border: 2px solid var(--line); border-radius: 12px; background: #fff; padding: 4px; display: flex; flex-direction: column; align-items: center; font: 700 11px system-ui; color: var(--ink); cursor: pointer; }
    .chip img { width: 46px; height: 46px; }
    .chip.on { border-color: var(--gold); background: #fff6dc; }
    .chip:disabled { cursor: default; opacity: 1; }
    .coinin { display: inline-flex; align-items: center; gap: 6px; font-weight: 800; }
    .coinin input { width: 110px; padding: 8px 10px; }
    .buildrow { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .buildrow .btn { padding: 8px; line-height: 1.3; }
    .card.off { opacity: .6; cursor: default; }
    #chathist { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(max(16px, env(safe-area-inset-bottom)) + 62px); width: min(440px, calc(100vw - 24px)); max-height: 40vh; overflow-y: auto; display: none; flex-direction: column; gap: 4px; padding: 10px; border-radius: 16px; background: var(--card); box-shadow: 0 10px 30px rgba(0,0,0,.2); z-index: 9; font-size: 13px; }
    #chathist div { overflow-wrap: anywhere; }
    .panel.wide { width: min(560px, calc(100vw - 24px)); }
    .field { width: 100%; border: 2px solid var(--line); border-radius: 12px; padding: 10px 12px; font: 600 15px ui-rounded, system-ui, sans-serif; color: var(--ink); background: #fff; outline: none; }
    .field:focus { border-color: var(--blue); }
    .field.small { width: auto; padding: 6px 8px; font-size: 13px; min-width: 0; }
    input.field.small { width: 80px; }
    .arows { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
    .arow { border: 2px solid var(--line); border-radius: 14px; padding: 8px 10px; display: flex; flex-direction: column; gap: 6px; }
    .aname { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .aacts { display: flex; gap: 6px; flex-wrap: wrap; }
    .role { font-size: 11px; font-weight: 800; padding: 2px 8px; border-radius: 999px; background: #e9eef3; text-transform: capitalize; }
    .role.admin, .role.owner { background: #ffe7a8; color: #8a5a00; } .role.moderator { background: #d7ecff; color: #1f5ea8; }
    .tag { font-size: 11px; font-weight: 800; padding: 2px 8px; border-radius: 999px; background: #ffd9d6; color: #a3261d; }
    .picklist { display: flex; flex-direction: column; gap: 2px; max-height: 34vh; overflow-y: auto; margin: 8px 0; border: 2px solid var(--line); border-radius: 12px; padding: 4px; }
    .pick { display: flex; align-items: center; gap: 8px; border: 0; background: #fff; text-align: left; padding: 6px 8px; border-radius: 8px; font: 600 14px ui-rounded, system-ui, sans-serif; color: var(--ink); cursor: pointer; }
    .pick img { width: 28px; height: 28px; }
    .pick.on, .pick:hover { background: #fff6dc; }
    #guide { position: fixed; left: 0; top: 0; margin-top: -18px; transform-origin: 0 50%; pointer-events: none; z-index: 3; display: none; filter: drop-shadow(0 0 6px #ffb800) drop-shadow(0 0 14px rgba(255,190,40,.8)); animation: glow 1.2s ease-in-out infinite; }
    #pin { position: fixed; left: 0; top: 0; margin: -54px 0 0 -20px; pointer-events: none; z-index: 3; display: none; filter: drop-shadow(0 0 6px #ffb800) drop-shadow(0 0 16px rgba(255,190,40,.9)); }
    #pin svg { animation: bob 1s ease-in-out infinite; }
    @keyframes glow { 0%, 100% { opacity: .85; } 50% { opacity: 1; } }
    @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
    .mbadge { display: inline-flex; align-items: center; gap: 4px; font: 800 11px ui-rounded, system-ui, sans-serif; padding: 3px 8px; border-radius: 999px; color: #fff; letter-spacing: .02em; }
    .mbadge.fly { background: #3a8ee6; box-shadow: 0 0 0 2px #cfe6ff; }
    .mbadge.glide { background: #18a39a; box-shadow: 0 0 0 2px #c9f2ee; }
    .card.fly { border-color: #9cc9f5; background: linear-gradient(#f0f7ff, #fff 60%); }
    .card.glide { border-color: #8fdcd4; background: linear-gradient(#ecfbf9, #fff 60%); }
    .pick .mbadge { margin-left: auto; }   /* the admin give list: fliers and gliders tagged at the right */
    #hatch .nm .mbadge { font-size: 14px; vertical-align: middle; }
    #buildbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 7; display: none; flex-direction: column; gap: 6px; padding: 8px max(10px, env(safe-area-inset-right)) max(10px, env(safe-area-inset-bottom)) max(10px, env(safe-area-inset-left)); background: var(--card); box-shadow: 0 -6px 20px rgba(0,0,0,.18); }
    .bbrow { display: flex; gap: 6px; overflow-x: auto; align-items: center; scrollbar-width: thin; }
    .bbtool { flex: none; border: 2px solid var(--line); border-radius: 12px; background: #fff; padding: 6px 10px; display: flex; flex-direction: column; align-items: center; gap: 2px; font: 700 12px ui-rounded, system-ui, sans-serif; color: var(--ink); cursor: pointer; }
    .bbtool span { display: inline-flex; align-items: center; gap: 3px; font-size: 11px; opacity: .8; }
    .bbtool .coin { width: 11px; height: 11px; border-width: 1px; }
    .bbtool.on { border-color: var(--blue); background: #eef6ff; }
    .swatch { flex: none; width: 30px; height: 30px; border-radius: 50%; border: 2px solid var(--line); cursor: pointer; }
    .swatch.on { border-color: var(--ink); box-shadow: 0 0 0 2px #fff, 0 0 0 4px var(--blue); }
    .bbbtn { flex: none; border: 0; border-radius: 12px; padding: 8px 12px; font: 800 13px ui-rounded, system-ui, sans-serif; background: #e9eef3; color: var(--ink); cursor: pointer; min-width: 40px; }
    .bbbtn.on { background: var(--blue); color: #fff; } .bbbtn.red.on { background: var(--red); }
    .bbbtn:disabled { opacity: .4; }
    .bblevel { font: 800 16px ui-rounded, system-ui, sans-serif; min-width: 18px; text-align: center; }
    @media (max-width: 420px) { #coins { font-size: 21px; } .btn { min-height: 48px; padding: 10px 13px; font-size: 14px; } }
  </style>
</head>
<body>
  <canvas id="gl"></canvas>
  <div id="top">
    <div>
      <span class="pill"><span class="coin"></span><span id="coins">0</span></span>
      <span class="pill" id="who"></span>
      <div id="party"></div>
    </div>
    <div>
      <span class="pill" id="bag"><span class="box"></span><b id="bagn">0/2</b></span>
      <span class="pill" id="wanted" style="display:none"></span>
      <span class="pill" id="online"><span class="dot" id="net"></span><b id="onlinen">1</b></span>
      <span class="pill" id="contract" style="display:none"><span class="row"><b id="cname">Contract</b><span id="ctime"></span></span><span class="bar"><i id="cbar"></i></span><span class="row"><span id="cdone"></span><span id="cmine"></span></span></span>
    </div>
  </div>
  <div id="joy"><i></i></div>
  <div id="pin"><svg viewBox="0 0 40 52" width="40" height="52"><path d="M20 50 4 28h10V2h12v26h10z" fill="#ffd35a" stroke="#fff8dc" stroke-width="2.5" stroke-linejoin="round"/></svg></div>
  <div id="side">
    <div id="items"></div>
    <div id="acts"></div>
    <button class="btn" id="btn-admin" type="button" style="display:none">Admin</button>
    <button class="btn" id="btn-build" type="button" style="display:none">Build</button>
    <button class="btn ghost" id="btn-chat" type="button">Chat</button>
    <button class="btn green" id="btn-jump" type="button">Jump</button>
    <button class="btn" id="btn-pets" type="button">Pets</button>
  </div>
  <div class="panel" id="p-pets"><h2>Pets <button class="x" type="button">✕</button></h2><div class="grid" id="petlist"></div></div>
  <div class="panel" id="p-shop"><h2>Egg Shop <button class="x" type="button">✕</button></h2><div class="grid" id="eggs"></div></div>
  <div class="panel" id="p-train"><h2>Training Yard <button class="x" type="button">✕</button></h2><div id="train"></div></div>
  <div class="panel" id="p-player"><h2><span id="pname"></span> <button class="x" type="button">✕</button></h2><div class="row2" id="player"></div></div>
  <div class="panel" id="p-trade"><h2><span>Trade · <span id="tname"></span></span> <button class="x" type="button">✕</button></h2><div id="trade"></div></div>
  <div class="panel" id="p-build"><h2>Pet pen <button class="x" type="button">✕</button></h2><div id="build"></div></div>
  <div id="buildbar"></div>
  <div class="panel wide" id="p-admin"><h2>Admin <button class="x" type="button">✕</button></h2><div id="admin"></div></div>
  <div class="panel" id="p-board"><h2>Contracts <button class="x" type="button">✕</button></h2><div id="board"></div></div>
  <div id="chatlog"></div>
  <div id="chathist"></div>
  <form id="chatbar" autocomplete="off"><input id="chatin" maxlength="120" enterkeyhint="send"><button class="btn" type="submit">Send</button></form>
  <div id="invite"><b id="iname"></b><span id="ikind"></span><button class="btn green" id="iyes" type="button">✓</button><button class="btn ghost" id="ino" type="button">✕</button></div>
  <form id="login" autocomplete="on"><div class="lbox"><h1>Pet Delivery Co.</h1>
    <input id="luser" name="username" autocomplete="username" placeholder="Username" maxlength="16" autocapitalize="off" spellcheck="false">
    <input id="lpass" name="password" type="password" autocomplete="current-password" placeholder="Password" maxlength="64">
    <span id="lerr"></span>
    <div class="row2"><button class="btn green" id="lgo" type="submit" style="flex:1">Log in</button><button class="btn" id="lnew" type="button" style="flex:1">Create account</button></div>
  </div></form>
  <div id="toast"></div>
  <div id="banner"></div>
  <div id="hatch"><canvas id="hatchc" width="440" height="440"></canvas><span class="nm" id="hatchn"></span><span class="rar" id="hatchr"></span><button class="btn green" id="hatchok" type="button">Ride</button></div>
  <script type="module" src="pets.js?v=1793100013"></script>
</body>
</html>
