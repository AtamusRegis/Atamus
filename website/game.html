  <style>
    /* (owner, 2026-10-18) the mining redesign — Crack, Bank and Haul — in the design document's look */

    /* ---- (owner, 2026-10-17) motion: panels slide in, buttons press, bars and chips react ---- */
    @keyframes panelin { from { opacity: 0; transform: translateY(10px) scale(.985); } }
    @keyframes dropin { from { opacity: 0; transform: translateX(-50%) translateY(-14px); } to { opacity: 1; transform: translateX(-50%) translateY(0); } }

    /* ---- (owner, 2026-10-18) touch screens, landscape: a compact layout with big tap targets. Sticks fly and aim;

    #chat-toggle { display: none; }

      #minimap { width: 108px; height: 108px; left: calc(8px + env(safe-area-inset-left, 0px)); bottom: calc(8px + env(safe-area-inset-bottom, 0px)); }
      #zone { font-size: 14px; top: calc(6px + env(safe-area-inset-top, 0px)); }
      #party { left: calc(8px + env(safe-area-inset-left, 0px)); top: calc(8px + env(safe-area-inset-top, 0px)); min-width: 0; }
      .pt-list { padding: 5px 8px; } .pt-mem { font-size: 11.5px; } .pt-head { font-size: 9px; }
      #hud { left: 50%; transform: translateX(-50%); bottom: calc(8px + env(safe-area-inset-bottom, 0px)); grid-template-columns: auto 128px 128px auto; gap: 5px; }
      .bar { height: 19px; } .bar span { padding: 0 5px; font-size: 9.5px; }
      #ship-chip { height: 19px; font-size: 12px; padding: 0 7px; } #credits { height: 19px; font-size: 11px; padding: 0 7px; }
      #cargo { width: 128px; gap: 2px; }
      #chat-log { height: 110px; }
      #prompt-box { top: calc(40px + env(safe-area-inset-top, 0px)); font-size: 12.5px; }
      #amount-box { top: 56px; width: 250px; }
      #dev { bottom: 8px; width: min(400px, calc(100vw - 16px)); }
      .overlay { top: calc(6px + env(safe-area-inset-top, 0px)); padding: 5px 10px; font-size: 11px; }
    }
  </style>
</head>

  <canvas id="view"></canvas>

  <div id="party" hidden></div>

    <div id="ship-chip"></div>
    <div id="hold-wrap"><div id="cargo"></div><div class="bar"><i id="hold-raw"></i><i id="hold-ref"></i><span><b>Hold</b><em id="hold-num" style="font-style:normal"></em></span></div></div>

  <div id="tip" hidden></div>
