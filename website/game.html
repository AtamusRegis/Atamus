<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-src 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="build" content="__BUILD__">
  <title>Atamus</title>
  <link rel="icon" href="favicon.png" type="image/png">
  <style>
    /* (owner, 2026-10-31) Atamus is a single-player sci-fi spaceport management game. */
    @font-face { font-family: "Big Shoulders Display"; font-weight: 800; font-display: swap; src: url("fonts/big-shoulders-display-latin-800-normal.woff2") format("woff2"); }
    @font-face { font-family: "JetBrains Mono"; font-weight: 600; font-display: swap; src: url("fonts/jetbrains-mono-latin-600-normal.woff2") format("woff2"); }
    :root { --bg: #0b0d10; --panel: rgba(16,19,24,.94); --rule: #2c323c; --ink: #ece7dc; --dim: #8b919b; --accent: #f2a93b; --red: #ff5a4a; --green: #7fd88a;
      --f-display: "Big Shoulders Display", Impact, sans-serif; --f-mono: "JetBrains Mono", ui-monospace, Menlo, monospace; color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--ink); font: 12px var(--f-mono); user-select: none; -webkit-user-select: none; }
    canvas { display: block; image-rendering: pixelated; }
    #view { position: fixed; inset: 0; width: 100%; height: 100%; touch-action: none; }
    .panel { position: fixed; z-index: 5; background: var(--panel); border: 2px solid var(--rule); }
    h2 { margin: 0; font: 800 22px var(--f-display); letter-spacing: .05em; line-height: 1; }
    .tag { color: var(--dim); font-size: 10.5px; letter-spacing: .14em; text-transform: uppercase; }
    #ship { right: 12px; top: 12px; width: 300px; padding: 12px; display: grid; gap: 10px; }
    #ship .head { display: flex; justify-content: space-between; align-items: start; gap: 8px; }
    .x { border: 0; background: none; color: var(--dim); font: 20px var(--f-mono); line-height: 1; cursor: pointer; padding: 0 2px; }
    .grid { display: grid; gap: 3px; }
    #cargo { grid-template-columns: repeat(6, 44px); }
    .slot { position: relative; width: 44px; height: 44px; background: #0d1014; border: 2px solid #232831; display: grid; place-items: center; }
    .slot canvas { width: 32px; height: 32px; pointer-events: none; }
    .slot b { position: absolute; right: 2px; bottom: 0; font-size: 11px; text-shadow: 0 1px 0 #000, 0 0 3px #000; pointer-events: none; }
    .slot.has { cursor: grab; } .slot.over { border-color: var(--accent); }
    .slot i { position: absolute; left: 1px; top: 1px; min-width: 14px; height: 14px; padding: 0 2px; font: 600 9.5px/14px var(--f-mono); font-style: normal; color: #111; text-align: center; pointer-events: none; }
    .slot.full { border-color: var(--red); }
    .slot.done { opacity: .35; }
    .btn { padding: 8px 12px; border: 2px solid var(--rule); background: #12161c; color: var(--ink); font: 600 11px var(--f-mono); letter-spacing: .1em; text-transform: uppercase; cursor: pointer; }
    .btn:hover { border-color: var(--accent); } .btn:disabled { opacity: .4; cursor: default; border-color: var(--rule); }
    #stores { left: 50%; bottom: 12px; transform: translateX(-50%); display: flex; gap: 8px; padding: 8px; max-width: calc(100vw - 24px); overflow-x: auto; }
    .store { width: 156px; padding: 8px; border: 2px solid var(--rule); background: #0f1217; display: grid; gap: 6px; cursor: pointer; flex: none; }
    .store.over { border-color: var(--accent); background: #1a1810; } .store.flash { border-color: var(--accent); }
    .store .top { display: flex; justify-content: space-between; align-items: baseline; }
    .store .name { font: 800 16px var(--f-display); letter-spacing: .05em; }
    .bar { height: 6px; background: #1d222a; } .bar i { display: block; height: 100%; }
    .store .grid { grid-template-columns: repeat(4, 34px); } .store .slot { width: 34px; height: 34px; border-width: 1px; } .store .slot canvas { width: 24px; height: 24px; } .store .slot b { font-size: 10px; }
    #ghost { position: fixed; z-index: 20; pointer-events: none; width: 44px; height: 44px; display: grid; place-items: center; transform: translate(-50%, -50%); }
    #ghost canvas { width: 36px; height: 36px; filter: drop-shadow(0 3px 2px rgba(0,0,0,.6)); } #ghost b { position: absolute; right: 0; bottom: -2px; font-size: 12px; text-shadow: 0 1px 0 #000, 0 0 3px #000; }
    [hidden] { display: none !important; }
    @media (max-width: 700px) { #ship { left: 8px; right: 8px; top: 8px; width: auto; } #cargo { grid-template-columns: repeat(6, 1fr); } .slot { width: auto; aspect-ratio: 1; height: auto; } #stores { bottom: 6px; padding: 6px; gap: 6px; } .store { width: 132px; } .store .grid { grid-template-columns: repeat(4, 28px); } .store .slot { width: 28px; height: 28px; aspect-ratio: auto; } }
  </style>
</head>
<body>
  <canvas id="view"></canvas>
  <div class="panel" id="ship" hidden>
    <div class="head"><div><h2 id="ship-name"></h2><div class="tag" id="ship-status"></div></div><button class="x" id="ship-close" type="button" aria-label="Close">×</button></div>
    <div class="grid" id="cargo"></div>
    <button class="btn" id="depart" type="button">Depart</button>
  </div>
  <div class="panel" id="stores"></div>
  <div id="ghost" hidden></div>
  <script src="game.js?v=1793000001"></script>
</body>
</html>
