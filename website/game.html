<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; connect-src 'self' https://play.atamus.io wss://play.atamus.io; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-src 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="atamus-build" content="__BUILD__">
  <title>Atamus — System</title>
  <link rel="icon" href="favicon.png" type="image/png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #18181e; }
    #view { display: block; width: 100%; height: 100%; touch-action: none; }
    .overlay { position: fixed; left: 50%; transform: translateX(-50%); color: #cfe0f4; font: 14px/1.4 system-ui, sans-serif; background: rgba(10, 14, 22, .85); border: 1px solid #2a3a52; border-radius: 6px; padding: 6px 12px; user-select: none; }
    #status { top: 12px; }
    #countdown { top: 12px; color: #ffd27a; border-color: #6a5a2a; }
    #minimap { position: fixed; left: 12px; bottom: 12px; width: 200px; height: 174px; pointer-events: none; }
    #side-pick { position: fixed; inset: 0; display: grid; place-items: center; background: rgba(5, 7, 12, .6); z-index: 10; }
    #side-pick .box { display: grid; gap: 14px; justify-items: center; padding: 20px 26px; background: rgba(10, 14, 22, .95); border: 1px solid #2a3a52; border-radius: 8px; color: #cfe0f4; font: 16px system-ui, sans-serif; }
    #side-pick .row { display: flex; gap: 12px; }
    #side-pick button { width: 110px; height: 44px; border-radius: 6px; border: 1px solid; font: 600 15px system-ui, sans-serif; cursor: pointer; color: #fff; }
    #side-pick button[data-side="red"] { background: #7a2020; border-color: #e04848; }
    #side-pick button[data-side="blue"] { background: #1f3f78; border-color: #4f8fe8; }
    #joy { display: none; position: fixed; left: 28px; bottom: 28px; width: 130px; height: 130px; border-radius: 50%; background: rgba(79, 143, 232, .12); border: 1px solid rgba(79, 143, 232, .5); touch-action: none; }
    #joy-knob { position: absolute; left: 40px; top: 40px; width: 50px; height: 50px; border-radius: 50%; background: rgba(79, 143, 232, .55); pointer-events: none; }
    html.touch #joy { display: block; }
    html.touch #minimap { top: 12px; bottom: auto; width: 130px; height: 113px; }
    #helpers-box { position: fixed; top: 12px; right: 12px; display: flex; gap: 6px; align-items: center; padding: 5px 10px; background: rgba(10, 14, 22, .85); border: 1px solid #2a3a52; border-radius: 6px; color: #9fb3cf; font: 12px system-ui, sans-serif; user-select: none; cursor: pointer; }
    #helpers-box input { margin: 0; accent-color: #4f8fe8; }
    html.touch #helpers-box { display: none; }
    /* (owner, 2026-10-13) the admin panel (adminpanel.js), for staff accounts: as wide as its contents, section icons floating on its left */
    #admin-btn { position: fixed; top: 12px; right: 158px; padding: 5px 12px; background: rgba(10, 14, 22, .85); border: 1px solid #6a5a2a; border-radius: 6px; color: #ffd27a; font: 600 12px system-ui, sans-serif; }
    #admin-panel { position: fixed; top: 52px; right: 12px; width: max-content; max-width: calc(100vw - 80px); background: rgba(10, 14, 22, .96); border: 1px solid #2a3a52; border-radius: 8px; color: #cfe0f4; font: 12px system-ui, sans-serif; z-index: 9; }
    #admin-panel button, #admin-panel input { background: #16202f; color: #cfe0f4; border: 1px solid #2a3a52; border-radius: 4px; padding: 3px 8px; font: 12px system-ui, sans-serif; }
    #admin-panel input { background: #0c121c; }
    .ap-rail { position: absolute; right: calc(100% + 8px); top: 0; display: grid; gap: 6px; }
    .ap-rail button { width: 34px; height: 34px; padding: 0 !important; display: grid; place-items: center; background: rgba(10, 14, 22, .92) !important; border-radius: 8px !important; }
    .ap-rail svg { width: 18px; height: 18px; fill: #9fb3cf; } .ap-rail button.on { border-color: #e8902a !important; } .ap-rail button.on svg, .ap-rail button:hover svg { fill: #fff; }
    .ap-x { position: absolute; top: 6px; right: 6px; font-size: 14px !important; line-height: 1; padding: 2px 7px !important; }
    .ap-body { display: grid; gap: 6px; padding: 8px 40px 8px 8px; }
    .ap-tabs { display: flex; gap: 4px; } .ap-tabs button.on { border-color: #e8902a !important; color: #fff !important; }
    .ap-search { width: 100%; box-sizing: border-box; }
    .ap-scroll { max-height: 300px; overflow-y: auto; }   /* about 10 rows, then it scrolls (the tabs and search stay) */
    .ap-wide { width: 520px; max-width: 100%; max-height: 60vh; }
    .ap-table { border-collapse: separate; border-spacing: 0 2px; }
    .ap-table td { padding: 3px 8px; background: #0f1724; white-space: nowrap; height: 22px; } .ap-table td:first-child { border-radius: 4px 0 0 4px; } .ap-table td:last-child { border-radius: 0 4px 4px 0; }
    .ap-mono { font-family: ui-monospace, Menlo, Consolas, monospace; width: 20ch; min-width: 20ch; font-weight: 600; } .ap-mono.red { color: #ff6a50; } .ap-mono.blue { color: #6fa8ff; }
    .ap-tag { display: inline-block; padding: 0 6px; border: 1px solid #c9a24a; border-radius: 3px; color: #ffd27a; font-size: 11px; } .ap-tag.ban { border-color: #e04848; color: #ff8a8a; }
    .ap-cell { vertical-align: middle; } .ap-cell > * { display: block; width: max-content; } .ap-total { color: #7f93ad; font-size: 10px; line-height: 1.3; } .ap-tag + .ap-total { margin-top: 1px; }
    .ap-list { display: grid; gap: 4px; }
    .ap-row { display: grid; grid-template-columns: 130px 1fr auto; gap: 8px; align-items: center; padding: 4px 6px; border-radius: 4px; background: #0f1724; }
    .ap-click { cursor: pointer; grid-template-columns: 130px 150px 1fr; } .ap-click:hover { background: #16202f; }
    .ap-name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .ap-st, .ap-dim, .ap-last { color: #7f93ad; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .ap-form { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 6px; margin: 2px 0 4px; border: 1px solid #22314a; border-radius: 4px; }
    .ap-form input { flex: 1; min-width: 140px; }
    .ap-err { color: #ff8a8a; margin: 0; width: 100%; }
    .ap-appeal { display: grid; gap: 6px; } .ap-appeal > button { justify-self: start; } .ap-title { margin: 0; font-weight: 600; } .ap-appeal .ap-dim { margin: 0; white-space: normal; }
    .ap-lines { max-height: 260px; overflow-y: auto; display: grid; gap: 3px; padding: 6px; background: #0c121c; border-radius: 4px; } .ap-lines p { margin: 0; } .ap-lines p.admin b { color: #ffd27a; }
    .ap-report { display: grid; } .ap-report .ap-text { margin: 0; white-space: pre-wrap; }
    /* (owner, 2026-10-13) the disciplinary panel: its own window */
    #disc-panel { position: fixed; inset: 0; z-index: 16; display: grid; place-items: center; background: rgba(5, 7, 12, .45); }
    .dp-box { display: grid; gap: 10px; width: 470px; max-width: calc(100vw - 24px); padding: 14px 16px; background: rgba(10, 14, 22, .97); border: 1px solid #2a3a52; border-radius: 8px; color: #cfe0f4; font: 12px system-ui, sans-serif; }
    .dp-box button, .dp-box input:not([type=range]) { background: #16202f; color: #cfe0f4; border: 1px solid #2a3a52; border-radius: 4px; padding: 4px 9px; font: 12px system-ui, sans-serif; }
    .dp-box input:not([type=range]) { background: #0c121c; flex: 1; }
    .dp-title { margin: 0; font: 600 14px system-ui, sans-serif; color: #fff; }
    .dp-row { display: flex; gap: 8px; align-items: flex-start; } .dp-label { width: 52px; flex: none; padding-top: 5px; color: #7f93ad; }
    .dp-seg { display: flex; flex-wrap: wrap; gap: 4px; } .dp-seg button.on { border-color: #e8902a; color: #fff; }
    .dp-len { flex: 1; display: grid; gap: 3px; } .dp-len input { width: 100%; margin: 0; accent-color: #e8902a; }
    .dp-ticks { display: flex; justify-content: space-between; color: #7f93ad; font-size: 10px; } .dp-ticks span.on { color: #ffd27a; }
    .dp-btns { display: flex; justify-content: flex-end; gap: 6px; } .dp-ok { border-color: #e8902a !important; color: #fff !important; }
    html.touch #disc-panel { display: none; }
    html.touch #admin-btn, html.touch #admin-panel { display: none; }
    #cap { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); width: 208px; height: 14px; background: rgba(10, 14, 22, .85); border: 1px solid #2a3a52; border-radius: 4px; overflow: hidden; pointer-events: none; }
    #cap-fill { height: 100%; width: 100%; background: linear-gradient(90deg, #2f9bd6, #7fd8ff); transition: width .08s linear; }
    #cap-fill.out { background: #6a4a2a; }
    #cap-num { position: absolute; inset: 0; display: grid; place-items: center; font: 600 10px system-ui, sans-serif; color: #e8f4ff; text-shadow: 0 0 2px #000; }
    html.touch #cap { bottom: 20px; left: auto; right: 20px; transform: none; }
    /* (owner, 2026-10-13) chat at the bottom right: the selected tab's lines, the input, the tabs */
    #chat { position: fixed; right: 12px; bottom: 12px; width: 340px; display: grid; gap: 4px; font: 12px system-ui, sans-serif; }
    #chat-log { max-height: 180px; overflow-y: auto; display: grid; gap: 1px; color: #dce7f5; text-shadow: 0 0 2px #000, 0 0 1px #000; }
    .chat-line.sys { color: #7f93ad; font-style: italic; }
    .chat-who.blue { color: #6fa8ff; } .chat-who.red { color: #ff6a50; } .chat-who[data-id] { cursor: pointer; }
    #chat-tabs { display: flex; flex-wrap: wrap; gap: 4px; }
    #chat-tabs button { display: flex; align-items: center; gap: 5px; background: rgba(10, 14, 22, .85); color: #9fb3cf; border: 1px solid #2a3a52; border-radius: 4px; padding: 2px 8px; font: 11px system-ui, sans-serif; }
    #chat-tabs button.on { color: #fff; border-color: #e8902a; }
    #chat-tabs button.new:not(.on) { color: #ffd27a; border-color: #6a5a2a; }
    .chat-x { color: #7f93ad; font-size: 13px; line-height: 1; } .chat-x:hover { color: #fff; }
    #chat-form { display: grid; margin: 0; }
    #chat-in { background: rgba(10, 14, 22, .85); color: #e8f0fb; border: 1px solid #2a3a52; border-radius: 4px; padding: 4px 6px; font: 12px system-ui, sans-serif; outline: none; }
    #chat-in:focus { border-color: #4f8fe8; }
    html.touch #chat { left: 12px; right: auto; top: 140px; bottom: auto; width: 240px; }
    #ctx-menu { position: fixed; z-index: 20; display: grid; min-width: 100px; padding: 3px; background: rgba(10, 14, 22, .97); border: 1px solid #2a3a52; border-radius: 6px; }
    #ctx-menu button { background: none; border: 0; color: #cfe0f4; text-align: left; padding: 5px 10px; border-radius: 4px; font: 12px system-ui, sans-serif; }
    #ctx-menu button:hover { background: #16202f; }
    #report-box { position: fixed; inset: 0; z-index: 15; display: grid; place-items: center; background: rgba(5, 7, 12, .5); }
    #report-box .box { display: grid; gap: 8px; width: 320px; padding: 14px; background: rgba(10, 14, 22, .97); border: 1px solid #2a3a52; border-radius: 8px; color: #cfe0f4; font: 13px system-ui, sans-serif; }
    #report-box textarea { height: 80px; resize: vertical; background: #0c121c; color: #e8f0fb; border: 1px solid #2a3a52; border-radius: 4px; padding: 6px; font: 12px system-ui, sans-serif; }
    #report-box .row { display: flex; gap: 6px; justify-content: flex-end; }
    #report-box button { background: #16202f; color: #cfe0f4; border: 1px solid #2a3a52; border-radius: 4px; padding: 4px 10px; font: 12px system-ui, sans-serif; }
    /* (owner, 2026-10-13) the system cursor is never shown on the game page; a small white dot follows the pointer instead, over the UI too */
    html:not(.touch), html:not(.touch) * { cursor: none !important; }
    #cursor { position: fixed; left: 0; top: 0; width: 4px; height: 4px; margin: -2px 0 0 -2px; border-radius: 50%; background: #fff; box-shadow: 0 0 0 1px rgba(0, 0, 0, .55); pointer-events: none; z-index: 1000; will-change: transform; }
    html.touch #cursor { display: none; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <canvas id="view"></canvas>
  <div id="status" class="overlay">Connecting…</div>
  <div id="countdown" class="overlay" hidden></div>
  <label id="helpers-box"><input id="helpers" type="checkbox">Weapon helpers</label>
  <canvas id="minimap"></canvas>
  <div id="chat"><div id="chat-log"></div><form id="chat-form"><input id="chat-in" type="text" maxlength="240" autocomplete="off" autocorrect="off" enterkeyhint="send"></form><div id="chat-tabs"></div></div>
  <div id="ctx-menu" hidden></div>
  <div id="report-box" hidden><div class="box"><b id="report-title"></b><textarea id="report-text" maxlength="1000"></textarea><div class="row"><button id="report-send">Send</button><button id="report-cancel">Cancel</button></div></div></div>
  <div id="joy"><div id="joy-knob"></div></div>
  <div id="side-pick" hidden><div class="box"><span>Choose a side</span><div class="row"><button data-side="red">Red</button><button data-side="blue">Blue</button></div></div></div>
  <div id="cap"><div id="cap-fill"></div><span id="cap-num">100</span></div>
  <div id="cursor" hidden></div>
  <script src="api.js?v=1791945557"></script>
  <script src="adminpanel.js?v=1791949489"></script>
  <script type="module" src="game3d.js?v=1791949219"></script>
</body>
</html>
