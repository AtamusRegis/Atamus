<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-src 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="build" content="__BUILD__">
  <title>Atamus</title>
  <link rel="icon" href="favicon.png" type="image/png">
  <style>
    /* (owner, 2026-10-31) Atamus is a single-player seaport management game. */
    @font-face { font-family: "Big Shoulders Display"; font-weight: 800; font-display: swap; src: url("fonts/big-shoulders-display-latin-800-normal.woff2") format("woff2"); }
    @font-face { font-family: "JetBrains Mono"; font-weight: 600; font-display: swap; src: url("fonts/jetbrains-mono-latin-600-normal.woff2") format("woff2"); }
    :root { --ink: #ece7dc; --dim: #8b919b; color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; overflow: hidden; background: #0b1218; color: var(--ink); font: 12px "JetBrains Mono", ui-monospace, monospace; user-select: none; -webkit-user-select: none; }
    canvas { display: block; image-rendering: pixelated; }
    #view { position: fixed; inset: 0; width: 100%; height: 100%; touch-action: none; }
    #hud { position: fixed; left: 12px; top: 10px; z-index: 5; display: flex; gap: 10px; align-items: center; padding: 6px 10px; background: rgba(12,16,22,.88); border: 2px solid #2c323c; }
    #money { font: 800 26px "Big Shoulders Display", Impact, sans-serif; letter-spacing: .04em; color: #7fd88a; min-width: 70px; }
    #buy-tractor, #buy-auto { padding: 6px 10px; border: 2px solid #3a4250; background: #12161c; color: var(--ink); font: 600 11px "JetBrains Mono", monospace; letter-spacing: .06em; cursor: pointer; }
    #buy-tractor:hover:not(:disabled) { border-color: #e8b432; } #buy-auto:hover:not(:disabled) { border-color: #5fd3d0; } #buy-tractor:disabled, #buy-auto:disabled { opacity: .45; cursor: default; }
  </style>
</head>
<body>
  <canvas id="view"></canvas>
  <div id="hud"><span id="money">$0</span><button id="buy-tractor" type="button"></button><button id="buy-auto" type="button"></button></div>
  <script src="game.js?v=1793000163"></script>
</body>
</html>
