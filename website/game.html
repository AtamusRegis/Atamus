<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; connect-src 'self' https://play.atamus.io wss://play.atamus.io; img-src 'self' data: blob:; media-src 'self' blob:; style-src 'self' 'unsafe-inline'; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-src 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="atamus-build" content="__BUILD__">
  <title>Atamus — Saturn</title>
  <link rel="icon" href="favicon.png" type="image/png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="stylesheet" href="theme.css?v=1792300002">
  <link rel="stylesheet" href="admin.css?v=1792300002">
  <style>
    /* (owner, 2026-10-16) the Saturn ring-mining prototype, in the design document's look */
    html, body { margin: 0; height: 100%; overflow: hidden; background: var(--void); color: var(--ink); font: 14px/1.45 var(--f-body); }
    #view { display: block; width: 100%; height: 100%; cursor: crosshair; }
    button { font-family: var(--f-body); }
    .overlay { position: fixed; left: 50%; top: 14px; transform: translateX(-50%); z-index: 20; padding: 7px 14px; background: var(--plate); border: 1px solid var(--rule); border-radius: 6px; font: 600 13px var(--f-mono); color: var(--ink); user-select: none; }
    .overlay[hidden] { display: none; }
    #countdown { color: var(--gold); border-color: rgba(216,176,106,.5); }
    /* the HUD: hold and fuel bars, the module, credits */
    #hud { position: fixed; left: calc((204px + 100vw - 414px) / 2); bottom: 16px; transform: translateX(-50%); z-index: 5; display: grid; grid-template-columns: auto 190px 190px auto; gap: 8px; align-items: center; user-select: none; pointer-events: none; }
    .bar { position: relative; height: 22px; border-radius: 4px; background: rgba(18,24,36,.92); border: 1px solid var(--rule); overflow: hidden; display: flex; }
    .bar i { display: block; height: 100%; transition: width .15s; }
    #hold-raw { background: var(--brown); } #hold-ref { background: var(--ore); } #fuel-fill { background: var(--ice); } #fuel-fill.low { background: var(--signal); }
    .bar span { position: absolute; inset: 0; display: flex; align-items: center; justify-content: space-between; padding: 0 8px; font: 600 11px var(--f-mono); color: #fff; text-shadow: 0 0 3px #000; letter-spacing: .04em; }
    .bar span b { font-weight: 600; text-transform: uppercase; letter-spacing: .1em; opacity: .85; }
    #mod-chip { height: 22px; display: flex; align-items: center; padding: 0 10px; border-radius: 4px; background: rgba(18,24,36,.92); border: 1px solid var(--rule); font: 800 15px var(--f-display); letter-spacing: .06em; text-transform: uppercase; color: var(--dim); }
    #mod-chip.on { color: var(--gold); border-color: rgba(216,176,106,.55); }
    #credits { height: 22px; display: flex; align-items: center; gap: 6px; padding: 0 10px; border-radius: 4px; background: rgba(18,24,36,.92); border: 1px solid var(--rule); font: 600 13px var(--f-mono); color: var(--gold); }
    #credits::before { content: ""; width: 9px; height: 9px; border-radius: 50%; background: var(--gold); }
    #zone { position: fixed; left: 50%; top: 14px; transform: translateX(-50%); z-index: 4; font: 800 18px var(--f-display); letter-spacing: .1em; text-transform: uppercase; color: var(--ink); opacity: .75; pointer-events: none; text-shadow: 0 0 6px #000; }
    /* my party and corporation */
    #party { position: fixed; left: 14px; top: 14px; z-index: 5; display: grid; gap: 6px; min-width: 150px; pointer-events: none; }
    #party[hidden] { display: none; }
    .pt-corp { font: 800 16px var(--f-display); letter-spacing: .08em; text-transform: uppercase; color: var(--ice); text-shadow: 0 0 6px #000; }
    .pt-list { padding: 8px 10px; background: rgba(18,24,36,.88); border: 1px solid var(--rule); border-radius: 6px; display: grid; gap: 2px; }
    .pt-head { font: 600 10px var(--f-mono); letter-spacing: .14em; text-transform: uppercase; color: var(--gold); margin-bottom: 2px; }
    .pt-mem { font: 13px var(--f-body); color: var(--ink); } .pt-mem.lead::after { content: " ★"; color: var(--gold); }
    /* the minimap */
    #minimap { position: fixed; left: 14px; bottom: 14px; width: 190px; height: 190px; z-index: 5; }
    /* the station panel (docked) */
    #station { position: fixed; right: 14px; top: 14px; bottom: 270px; width: 360px; max-width: calc(100vw - 28px); z-index: 7; overflow-y: auto; padding: 12px 14px 14px; background: rgba(18,24,36,.96); border: 1px solid var(--rule); border-radius: 6px; box-shadow: 0 20px 55px rgba(0,0,0,.55); }
    #station[hidden] { display: none; }
    .st-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px; }
    .st-title { font: 800 28px var(--f-display); letter-spacing: .04em; text-transform: uppercase; }
    .st-cr { display: flex; align-items: center; gap: 6px; font: 600 14px var(--f-mono); color: var(--gold); } .st-cr::before { content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--gold); }
    #station section { margin-top: 12px; }
    #station h3 { margin: 0 0 6px; font: 600 11px var(--f-mono); letter-spacing: .14em; text-transform: uppercase; color: var(--gold); }
    .st-row { display: flex; align-items: center; gap: 8px; padding: 5px 0; border-bottom: 1px solid rgba(38,48,68,.6); }
    .st-row:last-child { border-bottom: none; }
    .st-sw { flex: none; width: 12px; height: 12px; border-radius: 2px; background: var(--brown); border: 2px solid transparent; } .st-sw.ref { background: var(--ore); } .st-sw.fuel { background: var(--ice); }
    .st-name { flex: 1; min-width: 0; font-size: 14px; }
    .st-n { font: 600 13px var(--f-mono); color: var(--dim); font-variant-numeric: tabular-nums; }
    .st-acts { display: flex; gap: 4px; flex-wrap: wrap; justify-content: flex-end; }
    .st-tag { font: 600 10.5px var(--f-mono); letter-spacing: .1em; text-transform: uppercase; color: var(--gold); padding: 3px 8px; border: 1px solid rgba(216,176,106,.5); border-radius: 10px; }
    .st-empty { margin: 0; color: var(--dim); font-size: 13px; }
    .st-bar { flex: 0 0 90px; height: 6px; border-radius: 3px; background: var(--rule); overflow: hidden; } .st-bar i { display: block; height: 100%; width: 0; background: var(--ore); }
    #station button { padding: 4px 10px; border: 1px solid var(--rule); border-radius: 4px; background: rgba(255,255,255,.05); color: var(--ink); font: 600 12px var(--f-body); cursor: pointer; white-space: nowrap; }
    #station button:hover:not(:disabled) { background: rgba(255,255,255,.1); }
    #station button.gold { background: var(--gold); color: #1a1205; border-color: transparent; }
    #station button.gold:hover:not(:disabled) { filter: brightness(1.08); }
    #station button:disabled { opacity: .4; cursor: default; }
    /* chat, bottom right */
    #chat { position: fixed; right: 14px; bottom: 14px; width: 400px; max-width: calc(100vw - 28px); z-index: 6; display: grid; gap: 4px; }
    #chat-tabs { display: flex; gap: 3px; }
    #chat-tabs button { padding: 2px 9px; border: 1px solid var(--rule); border-radius: 4px; background: rgba(18,24,36,.85); color: var(--dim); font: 600 11px var(--f-mono); letter-spacing: .04em; cursor: pointer; }
    #chat-tabs button.on { color: var(--ink); border-color: var(--gold); } #chat-tabs button.new { color: var(--gold); }
    #chat-panel { background: rgba(18,24,36,.82); border: 1px solid var(--rule); border-radius: 6px; overflow: hidden; }
    #chat-log { height: 140px; overflow-y: auto; padding: 6px 8px; font: 13px/1.4 var(--f-body); display: flex; flex-direction: column; }
    #chat-log > :first-child { margin-top: auto; }
    .chat-line { overflow-wrap: anywhere; } .chat-line.sys { color: var(--dim); font-style: italic; }
    .chat-ch { font: 600 11px var(--f-mono); } .chat-ch.global { color: var(--dim); } .chat-ch.zone { color: var(--ink); } .chat-ch.party { color: var(--gold); } .chat-ch.corp { color: var(--ice); } .chat-ch.whisper { color: var(--ore); }
    .chat-who { font-weight: 700; color: var(--ink); cursor: context-menu; }
    #chat-form { display: flex; align-items: center; gap: 6px; padding: 5px 8px; border-top: 1px solid var(--rule); background: rgba(11,14,21,.6); }
    #chat-pre { flex: none; white-space: nowrap; }
    #chat-in { flex: 1; min-width: 0; padding: 3px 0; border: none; background: transparent; color: var(--ink); font: 13px var(--f-body); outline: none; }
    #ctx-menu { position: fixed; z-index: 30; display: grid; min-width: 160px; padding: 4px; background: var(--plate); border: 1px solid var(--rule); border-radius: 6px; box-shadow: 0 12px 30px rgba(0,0,0,.5); }
    #ctx-menu[hidden] { display: none; }
    #ctx-menu button { padding: 6px 10px; border: none; border-radius: 4px; background: none; color: var(--ink); text-align: left; font: 13px var(--f-body); cursor: pointer; } #ctx-menu button:hover { background: rgba(255,255,255,.07); }
    #report-box { position: fixed; inset: 0; z-index: 30; display: grid; place-items: center; background: rgba(0,0,0,.45); } #report-box[hidden] { display: none; }
    #report-box .box { display: grid; gap: 8px; width: 340px; padding: 14px; background: var(--plate); border: 1px solid var(--rule); border-radius: 6px; }
    #report-box textarea { height: 90px; padding: 6px; border: 1px solid var(--rule); border-radius: 4px; background: var(--void); color: var(--ink); font: 13px var(--f-body); resize: none; }
    #report-box .row { display: flex; justify-content: flex-end; gap: 6px; }
    #report-box button { padding: 5px 12px; border: 1px solid var(--rule); border-radius: 4px; background: rgba(255,255,255,.05); color: var(--ink); cursor: pointer; } #report-box #report-send { background: var(--gold); color: #1a1205; border: none; font-weight: 700; }
    #staff-col { position: fixed; right: 14px; top: 50%; transform: translateY(-50%); z-index: 6; display: flex; flex-direction: column; gap: 4px; }
    body:has(#station:not([hidden])) #staff-col { right: 384px; }
    @media (max-width: 900px) { #hud { grid-template-columns: 1fr 1fr; bottom: 220px; } #chat { width: calc(100vw - 230px); } }
  </style>
</head>
<body>
  <canvas id="view"></canvas>
  <div id="zone"></div>
  <div id="party" hidden></div>
  <div id="hud">
    <div id="mod-chip"></div>
    <div class="bar"><i id="hold-raw"></i><i id="hold-ref"></i><span><b>Hold</b><em id="hold-num" style="font-style:normal"></em></span></div>
    <div class="bar"><i id="fuel-fill"></i><span><b>Fuel</b><em id="fuel-num" style="font-style:normal"></em></span></div>
    <div id="credits"></div>
  </div>
  <canvas id="minimap"></canvas>
  <div id="station" hidden></div>
  <div id="staff-col"></div>
  <div id="chat"><div id="chat-tabs"></div><div id="chat-panel"><div id="chat-log"></div><form id="chat-form"><span id="chat-pre"></span><input id="chat-in" type="text" maxlength="240" autocomplete="off" enterkeyhint="send"></form></div></div>
  <div id="ctx-menu" hidden></div>
  <div id="report-box" hidden><div class="box"><b id="report-title"></b><textarea id="report-text" maxlength="1000"></textarea><div class="row"><button id="report-cancel" type="button">Cancel</button><button id="report-send" type="button">Send</button></div></div></div>
  <div id="status" class="overlay">Connecting…</div>
  <div id="countdown" class="overlay" hidden></div>
  <script src="api.js?v=1791945557"></script>
  <script src="adminpanel.js?v=1792300002"></script>
  <script type="module" src="game.js?v=1792300002"></script>
</body>
</html>
