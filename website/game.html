<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; connect-src 'self' https://play.atamus.io wss://play.atamus.io; img-src 'self' data: blob:; media-src 'self' blob:; style-src 'self' 'unsafe-inline'; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-src 'none'">

  <link rel="preload" href="fonts/atkinson-hyperlegible-latin-700-normal.woff2" as="font" type="font/woff2" crossorigin>

  <style>
    /* (owner, 2026-10-18) the sandbox build live: no chat, no panels beyond the station, the mode switch by the hold bar */
    html, body { margin: 0; height: 100%; overflow: hidden; background: var(--void); color: var(--ink); font: 14px/1.45 var(--f-body); touch-action: none; }
    #view { display: block; width: 100%; height: 100%; cursor: crosshair; }
    button { font-family: var(--f-body); }
    .overlay { position: fixed; left: 50%; top: 14px; transform: translateX(-50%); z-index: 20; padding: 7px 14px; background: var(--plate); border: 1px solid var(--rule); border-radius: 6px; font: 600 13px var(--f-mono); color: var(--ink); user-select: none; }
    .overlay[hidden] { display: none; }
    #countdown { color: var(--gold); border-color: rgba(216,176,106,.5); }
    /* the HUD: the ship chip, the mode switch, the hold bar */
    #hud { position: fixed; left: 50%; bottom: calc(14px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 5; display: grid; gap: 6px; justify-items: center; user-select: none; pointer-events: none; }
    #modes { display: flex; gap: 6px; min-height: 28px; }
    .chip { pointer-events: auto; height: 28px; display: flex; align-items: center; padding: 0 12px; gap: 8px; border-radius: 5px; background: rgba(18,24,36,.92); border: 1px solid var(--rule); color: var(--dim); font: 800 13px var(--f-display); letter-spacing: .06em; text-transform: uppercase; cursor: pointer; }
    .chip:active { transform: scale(.96); }
    #mode-sw { gap: 0; padding: 0; overflow: hidden; }
    #mode-sw b { padding: 0 11px; height: 100%; display: flex; align-items: center; color: var(--dim); font-weight: 800; }
    #mode-sw b.on { color: var(--ice); background: rgba(124,195,214,.16); }
    #mode-sw b + b { border-left: 1px solid var(--rule); }
    #mode-sw[hidden] { display: none; }
    #tut-chip.on { color: var(--gold); border-color: rgba(216,176,106,.6); }
    .hud-row { display: flex; gap: 8px; align-items: end; }
    #ship-chip { height: 24px; white-space: nowrap; display: flex; align-items: center; padding: 0 10px; border-radius: 4px; background: rgba(18,24,36,.92); border: 1px solid rgba(216,176,106,.55); font: 800 15px var(--f-display); letter-spacing: .06em; text-transform: uppercase; color: var(--gold); user-select: none; }
    .bar { position: relative; width: 210px; height: 24px; border-radius: 4px; background: rgba(18,24,36,.92); border: 1px solid var(--rule); overflow: hidden; display: flex; }
    .bar i { display: block; height: 100%; transition: width .25s cubic-bezier(.3,.8,.4,1); }
    #hold-raw { background: var(--brown); } #hold-ref { background: var(--ore); }
    .bar span { position: absolute; inset: 0; display: flex; align-items: center; justify-content: space-between; padding: 0 8px; font: 600 11px var(--f-mono); color: #fff; text-shadow: 0 0 3px #000; letter-spacing: .04em; }
    .bar span b { font-weight: 600; text-transform: uppercase; letter-spacing: .1em; opacity: .85; }
    /* the hold above its bar: one square per ore type with that square's own count; refined squares edged white */
    #hold-wrap { position: relative; }
    #cargo { position: absolute; left: 0; bottom: calc(100% + 6px); width: 210px; display: flex; flex-wrap: wrap-reverse; gap: 3px; align-items: flex-end; pointer-events: auto; }
    #cargo i { border-radius: 2px; position: relative; box-shadow: inset 0 0 0 1px rgba(0,0,0,.35); animation: popin .3s cubic-bezier(.3,1.2,.4,1); cursor: context-menu; }
    #cargo i.slot { width: 22px; height: 20px; }
    #cargo i b.n { position: absolute; right: 2px; bottom: 0; font: 600 10px var(--f-mono); font-style: normal; color: #fff; text-shadow: 0 0 3px #000, 0 0 3px #000; }
    #cargo i.ref { box-shadow: inset 0 0 0 1.5px #fff; }
    #tip { position: fixed; z-index: 40; pointer-events: none; padding: 5px 8px; border-radius: 4px; background: var(--plate); border: 1px solid var(--rule); font: 600 12px var(--f-mono); color: var(--ink); white-space: pre; box-shadow: 0 8px 20px rgba(0,0,0,.45); }
    #tip[hidden] { display: none; }
    #zone { position: fixed; left: 50%; top: 14px; transform: translateX(-50%); z-index: 4; font: 800 18px var(--f-display); letter-spacing: .1em; text-transform: uppercase; color: var(--ink); opacity: .75; pointer-events: none; text-shadow: 0 0 6px #000; }
    /* the optional tutorial, under the zone name */
    #tut { position: fixed; left: 50%; transform: translateX(-50%); top: calc(48px + env(safe-area-inset-top, 0px)); z-index: 6; display: flex; align-items: center; gap: 9px; max-width: min(86vw, 520px); padding: 7px 6px 7px 14px; background: rgba(18,24,36,.95); border: 1px solid rgba(216,176,106,.5); border-radius: 6px; font: 400 13px var(--f-body); color: var(--ink); }
    #tut[hidden] { display: none; }
    #tut b { font: 800 13px var(--f-display); color: var(--gold); letter-spacing: .05em; white-space: nowrap; }
    #tut button { background: none; border: 0; color: var(--dim); font: 700 14px var(--f-body); cursor: pointer; padding: 2px 8px; }
    #note { position: fixed; left: 50%; transform: translateX(-50%); top: calc(96px + env(safe-area-inset-top, 0px)); z-index: 6; padding: 6px 14px; background: rgba(18,24,36,.95); border: 1px solid var(--rule); border-radius: 6px; font: 600 12px var(--f-mono); color: var(--gold); opacity: 0; transition: opacity .25s; pointer-events: none; max-width: 86vw; text-align: center; }
    #zoom-col { display: none; }
    body.touch #zoom-col { position: fixed; left: calc(8px + env(safe-area-inset-left, 0px)); bottom: calc(126px + env(safe-area-inset-bottom, 0px)); z-index: 6; display: grid; gap: 5px; }
    body.touch #zoom-col button { width: 38px; height: 38px; border-radius: 7px; background: rgba(18,24,36,.92); border: 1px solid var(--rule); color: var(--ink); font: 800 19px var(--f-mono); cursor: pointer; padding: 0; }
    /* the minimap */
    #minimap { position: fixed; left: 14px; bottom: 14px; width: 190px; height: 190px; z-index: 5; }
    /* the station panel (docked): the ships, one to board, and storage */
    #station { position: fixed; right: 14px; top: 14px; bottom: 60px; width: 360px; max-width: calc(100vw - 28px); z-index: 7; overflow-y: auto; padding: 12px 14px 14px; background: rgba(18,24,36,.96); border: 1px solid var(--rule); border-radius: 6px; box-shadow: 0 20px 55px rgba(0,0,0,.55); animation: panelin .18s ease-out; }
    #station[hidden] { display: none; }
    .st-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px; }
    .st-title { font: 800 28px var(--f-display); letter-spacing: .04em; text-transform: uppercase; }
    #station section { margin-top: 12px; }
    #station h3 { margin: 0 0 6px; font: 600 11px var(--f-mono); letter-spacing: .14em; text-transform: uppercase; color: var(--gold); }
    .st-empty { margin: 0; color: var(--dim); font-size: 13px; }
    .st-ship { padding: 8px 10px; border: 1px solid var(--rule); border-radius: 6px; background: rgba(11,14,21,.55); margin-bottom: 8px; transition: border-color .15s ease; }
    .st-ship:hover { border-color: var(--dim); } .st-ship.aboard { border-color: rgba(216,176,106,.55); }
    .st-ship-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .st-ship-name { font: 800 18px var(--f-display); letter-spacing: .05em; text-transform: uppercase; }
    .st-stats { display: grid; grid-template-columns: auto 1fr; gap: 2px 12px; font: 12px var(--f-mono); color: var(--dim); margin-top: 4px; } .st-stats b { font-weight: 600; color: var(--ink); text-align: right; }
    .st-row { display: flex; align-items: center; gap: 8px; padding: 5px 0; }
    .st-sw { flex: none; width: 12px; height: 12px; border-radius: 3px; background: var(--ice); }
    .st-name { flex: 1; min-width: 0; font-size: 14px; }
    .st-n { font: 600 13px var(--f-mono); color: var(--dim); font-variant-numeric: tabular-nums; }
    .st-tag { font: 600 10.5px var(--f-mono); letter-spacing: .1em; text-transform: uppercase; color: var(--gold); padding: 3px 8px; border: 1px solid rgba(216,176,106,.5); border-radius: 10px; }
    #station button { padding: 4px 10px; border: 1px solid var(--rule); border-radius: 4px; background: rgba(255,255,255,.05); color: var(--ink); font: 600 12px var(--f-body); cursor: pointer; white-space: nowrap; }
    #station button:hover:not(:disabled) { background: rgba(255,255,255,.1); }
    #station button.gold { background: var(--gold); color: #1a1205; border-color: transparent; }
    #station button.gold:hover:not(:disabled) { filter: brightness(1.08); }
    #station button:disabled { opacity: .4; cursor: default; }
    #ctx-menu { position: fixed; z-index: 30; display: grid; min-width: 160px; padding: 4px; background: var(--plate); border: 1px solid var(--rule); border-radius: 6px; box-shadow: 0 12px 30px rgba(0,0,0,.5); animation: menuin .12s ease-out; transform-origin: 12px 10px; }
    #ctx-menu[hidden] { display: none; }
    #ctx-menu button { padding: 6px 10px; border: none; border-radius: 4px; background: none; color: var(--ink); text-align: left; font: 13px var(--f-body); cursor: pointer; } #ctx-menu button:hover { background: rgba(255,255,255,.07); }
    @media (max-width: 900px) { #hud { bottom: calc(14px + env(safe-area-inset-bottom, 0px)); } }
    /* ---- motion ---- */
    @keyframes panelin { from { opacity: 0; transform: translateY(10px) scale(.985); } }
    @keyframes menuin { from { opacity: 0; transform: scale(.9); } }
    @keyframes barpop { 35% { transform: scaleY(1.25) scaleX(1.015); } }
    @keyframes zonein { from { opacity: 0; letter-spacing: .3em; } to { opacity: .75; } }
    @keyframes popin { from { transform: scale(.2); } 70% { transform: scale(1.25); } }
    #tip { animation: menuin .1s ease-out; }
    #hold-wrap.pop .bar { animation: barpop .28s ease-out; }
    #zone.zswap { animation: zonein .5s ease-out; }
    .ore-fly { position: fixed; z-index: 18; width: 11px; height: 11px; margin: -5px 0 0 -5px; border-radius: 2px; background: var(--gold); box-shadow: 0 0 8px rgba(216,176,106,.8); pointer-events: none; transition: transform .42s cubic-bezier(.35,.65,.3,1), opacity .42s ease-in; }
    #station button, #ctx-menu button, .chip { transition: transform .07s ease, background .14s ease, border-color .14s ease, color .14s ease, filter .14s ease; }
    #station button:active:not(:disabled), #ctx-menu button:active { transform: scale(.94); }
    @media (prefers-reduced-motion: reduce) { #station, #ctx-menu, #tip, #cargo i { animation: none !important; } }
    /* ---- touch screens, landscape: compact, big tap targets; sticks fly and aim; hold = right-click; pinch zooms ---- */
    body.touch #ctx-menu button { padding: 11px 14px; font-size: 15px; }
    body.touch #station button { padding: 9px 14px; font-size: 14px; }
    body.touch #station { top: calc(8px + env(safe-area-inset-top, 0px)); bottom: calc(8px + env(safe-area-inset-bottom, 0px)); right: calc(8px + env(safe-area-inset-right, 0px)); width: min(340px, 60vw); }
    @media (pointer: coarse) and (max-height: 620px) {
      #minimap { width: 108px; height: 108px; left: calc(8px + env(safe-area-inset-left, 0px)); bottom: calc(8px + env(safe-area-inset-bottom, 0px)); }
      #zone { font-size: 14px; top: calc(6px + env(safe-area-inset-top, 0px)); }
      #tut { top: calc(32px + env(safe-area-inset-top, 0px)); font-size: 12px; }
      #hud { bottom: calc(6px + env(safe-area-inset-bottom, 0px)); gap: 4px; }
      .bar { width: 150px; height: 20px; } .bar span { padding: 0 5px; font-size: 9.5px; }
      .chip { height: 24px; font-size: 11.5px; padding: 0 9px; } #mode-sw b { padding: 0 9px; }
      #ship-chip { height: 20px; font-size: 12px; padding: 0 7px; }
      #cargo { width: 150px; gap: 2px; }
      .overlay { top: calc(6px + env(safe-area-inset-top, 0px)); padding: 5px 10px; font-size: 11px; }
    }
  </style>
</head>
<body>
  <canvas id="view"></canvas>
  <div id="zone"></div>
  <div id="tut" hidden><b id="tut-n"></b><span id="tut-text"></span><button id="tut-skip" type="button">✕</button></div>
  <div id="note"></div>
  <div id="hud">
    <div id="modes"></div>
    <div class="hud-row">
      <div id="ship-chip"></div>
      <div id="hold-wrap"><div id="cargo"></div><div class="bar"><i id="hold-raw"></i><i id="hold-ref"></i><span><b>Hold</b><em id="hold-num" style="font-style:normal"></em></span></div></div>
    </div>
  </div>
  <canvas id="minimap"></canvas>
  <div id="zoom-col"><button id="zoom-in" type="button">+</button><button id="zoom-out" type="button">−</button></div>
  <div id="station" hidden></div>
  <div id="ctx-menu" hidden></div>
  <div id="tip" hidden></div>
  <div id="status" class="overlay">Connecting…</div>
  <div id="countdown" class="overlay" hidden></div>
  <script src="api.js?v=1792500001"></script>
  <script type="module" src="game.js?v=1792500019"></script>
</body>
</html>
