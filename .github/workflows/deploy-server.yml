name: Deploy server

on:
  push:
    branches: [main]
    paths:
      - "packages/server/**"
      - "scripts/deploy.sh"
      - ".github/workflows/deploy-server.yml"
  workflow_dispatch:

# the server: repository secrets DEPLOY_KEY (the deploy key's private half; ATAMUS_DEPLOY_KEY still works) and DEPLOY_HOST,
# repository variable GAME_SERVER (its https address); atamus.io's server by default
env:
  GAME_SERVER: ${{ vars.GAME_SERVER || 'https://play.atamus.io' }}

concurrency:
  group: deploy-server
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check (a broken file never deploys)
        run: bash scripts/check.sh
      # (owner, 2026-10-15) a push that also changes the website: the countdown says so, and players wait on the update
      # page until both halves are live (one trip, not two)
      - name: Warn players (1 s countdown for now) before switching the live build
        run: |
          ALSO=""
          BEFORE="${{ github.event.before }}"
          if [ -n "$BEFORE" ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            if git diff --name-only "$BEFORE" "$GITHUB_SHA" | grep -qE '^(website/|\.github/workflows/deploy-website\.yml)'; then ALSO="web"; fi
          fi
          curl -sS --retry 3 --retry-all-errors -X POST "$GAME_SERVER/game/update-countdown?part=server&also=$ALSO" -w "\nHTTP %{http_code}\n" || true
          sleep 1
      - name: Trigger redeploy over SSH
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY || secrets.ATAMUS_DEPLOY_KEY }}
          HOST: ${{ secrets.DEPLOY_HOST || '144.202.66.235' }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy

          echo "Public key derived from the secret (should match the server's):"
          ssh-keygen -y -f ~/.ssh/id_deploy

          # The deploy key is forced to run the redeploy script, so the command
          # sent here is ignored. accept-new trusts the host on first contact
          # (fresh runner each time), and IdentitiesOnly avoids other agent keys.
          ssh -i ~/.ssh/id_deploy \
              -o IdentitiesOnly=yes \
              -o StrictHostKeyChecking=accept-new \
              -o ConnectTimeout=15 \
              "root@$HOST" deploy
