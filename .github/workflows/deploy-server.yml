name: Deploy server

on:
  push:
    branches: [main]
    paths:
      - "packages/server/**"
      - "packages/shared/**"
      - "scripts/deploy.sh"
      - ".github/workflows/deploy-server.yml"
  workflow_dispatch:

concurrency:
  group: deploy-server
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger redeploy over SSH
        env:
          DEPLOY_KEY: ${{ secrets.ATAMUS_DEPLOY_KEY }}
          HOST: 144.202.66.235
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy

          echo "Public key derived from the secret (should match the server's):"
          ssh-keygen -y -f ~/.ssh/id_deploy

          # The deploy key is forced to run the redeploy script, so the command
          # sent here is ignored. accept-new trusts the host on first contact
          # (fresh runner each time), and IdentitiesOnly avoids other agent keys.
          ssh -i ~/.ssh/id_deploy \
              -o IdentitiesOnly=yes \
              -o StrictHostKeyChecking=accept-new \
              -o ConnectTimeout=15 \
              "root@$HOST" deploy
