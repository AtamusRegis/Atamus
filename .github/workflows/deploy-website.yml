name: Deploy website

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - ".github/workflows/deploy-website.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/configure-pages@v5
      - name: Stamp build id (clients compare it to reload onto new versions)
        run: |
          echo "{\"v\":\"${GITHUB_SHA}\"}" > website/version.json
          sed -i "s/__BUILD__/${GITHUB_SHA}/g" website/game.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: website
      - name: Warn players (1 s countdown for now) before switching the live build
        run: |
          ALSO=""
          BEFORE="${{ github.event.before }}"
          if [ -n "$BEFORE" ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            if git diff --name-only "$BEFORE" "$GITHUB_SHA" | grep -qE '^(packages/server/|packages/shared/|scripts/deploy\.sh|\.github/workflows/deploy-server\.yml)'; then ALSO="server"; fi
          fi
          curl -sS --retry 3 --retry-all-errors -X POST "https://play.atamus.io/game/update-countdown?part=web&also=$ALSO" -w "\nHTTP %{http_code}\n" || true
          sleep 1
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Tell the game server a new website build is live (it reloads connected players)
        run: curl -fsS -X POST https://play.atamus.io/game/build-check || true
