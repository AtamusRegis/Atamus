<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; connect-src 'self' https://play.atamus.io wss://play.atamus.io; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-src 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Atamus</title>
  <link rel="icon" href="favicon.png" type="image/png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="stylesheet" href="style.css?v=1791763226">
</head>
<body>
  <div class="bg" aria-hidden="true">
    <div class="bg-gradient"></div>
    <div class="bg-grid"></div>
    <svg class="bg-noise" xmlns="http://www.w3.org/2000/svg">
      <filter id="noise">
        <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch">
          <animate attributeName="seed" dur="4s" repeatCount="indefinite" calcMode="discrete"
                   values="0;7;14;21;28;35;42;49;56;3;10;17;24;31;38;45;52;59" />
        </feTurbulence>
        <feColorMatrix type="saturate" values="0"/>
      </filter>
      <rect width="100%" height="100%" filter="url(#noise)"/>
    </svg>
    <div class="bg-vignette"></div>
  </div>

  <header class="site-head"><a class="site-logo" href="index.html"><img src="assets/logo.png" srcset="assets/logo.png 1x, assets/logo@2x.png 2x" width="182" height="36" alt="Atamus"></a></header>

  <main>
    <section class="card" id="play-card" aria-labelledby="title">
      <h1 id="title" class="brand">Atamus</h1>
      <div class="form">
        <p class="welcome"><span id="hello">Welcome back</span>, <strong id="who">…</strong></p>
        <!-- (owner) someone asked to reset this account's password: the owner can say it isn't them, then change it -->
        <div id="reset-note" class="reset-note" hidden>
          <p class="reset-title">Password reset requested</p>
          <p id="reset-when"></p>
          <button type="button" class="btn btn-ghost" id="not-me">This is not me</button>
          <form id="pw-form" class="form" novalidate hidden>
            <label class="field"><span>Current password</span><input name="current" type="password" autocomplete="current-password" required></label>
            <label class="field"><span>New password</span><input name="password" type="password" autocomplete="new-password" required minlength="8"></label>
            <label class="field"><span>Confirm new password</span><input name="confirm" type="password" autocomplete="new-password" required minlength="8"></label>
            <p class="msg" id="pw-msg" role="alert" hidden></p>
            <button type="submit" class="btn btn-primary">Change password</button>
          </form>
        </div>
        <div id="update-step" hidden>
          <p class="update-title">Atamus is updating</p>
          <p class="hint" id="update-msg">Back in a moment…</p>
        </div>
        <div id="char-step" hidden>
          <form id="char-form" class="form" novalidate>
            <p class="step-title">Your character</p>
            <div id="char-builder"></div>
            <p class="msg" id="char-msg" role="alert" hidden></p>
            <button type="submit" class="btn btn-primary">Create character</button>
          </form>
        </div>
        <div id="pilot-step" hidden>
          <form id="pilot-form" class="form" novalidate>
            <p class="step-title">Your first pilot</p>
            <div id="pilot-builder"></div>
            <label class="field">
              <span>Pilot name</span>
              <input name="name" type="text" required maxlength="24" spellcheck="false" autocomplete="off">
            </label>
            <label class="field">
              <span>Starting planet</span>
              <select name="start" class="select"><option value="mercury">Mercury</option><option value="venus">Venus</option><option value="earth" selected>Earth</option><option value="mars">Mars</option><option value="jupiter">Jupiter</option><option value="saturn">Saturn</option><option value="uranus">Uranus</option><option value="neptune">Neptune</option></select>
            </label>
            <p class="msg" id="pilot-msg" role="alert" hidden></p>
            <button type="submit" class="btn btn-primary">Create pilot</button>
          </form>
        </div>
        <div id="enter-step" hidden>
          <a class="btn btn-primary" href="game.html">Enter System</a>
        </div>
        <button type="button" class="btn btn-ghost" id="logout">Log out</button>
      </div>
    </section>
  </main>

  <script src="api.js?v=1791763226"></script>
  <script src="portrait.js?v=1791701182"></script>
  <script src="play.js?v=1791763226" defer></script>
</body>
</html>
